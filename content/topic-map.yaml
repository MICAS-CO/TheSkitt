    label: Acute heart failure (de novo + decompensated)
    tier: 1
    curriculum_codes: [CC4, CP2]
    slos: [SLO1, SLO3]
    paeds: no
    rationale: 'Wet-and-warm vs cold-and-dry phenotype. CPAP first-line for cardiogenic pulmonary oedema. Diuresis + GTN. POCUS for B-lines and IVC. Distinguish from RVF (different management).'
    sources:
