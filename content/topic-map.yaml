# The Skitt — high-yield topic map
#
# Drives WHICH cases we author. Maps each topic to the RCEM 2021 Clinical
# Syllabus code(s), the SLO(s) it tests, the authoritative UK guideline source(s),
# and a priority tier. Calibrated against:
#   - RCEM Curriculum 2021 (v1.5, Aug 2025) — Clinical Syllabus pp.59–68; SLOs
#     pp.10–58; assessment blueprint p.78 ("anything in the Clinical Syllabus
#     can appear in formal examinations, and each of the relevant SLOs will be
#     tested").
#   - RCEMLearning public surface (FRCEM SBA blueprint, module catalogue) —
#     used for topic-frequency calibration only. No content ingested.
#   - Cross-checks: NICE guidance, Resus Council UK ALS/APLS/anaphylaxis 2021,
#     BTS/SIGN, JBDS-IP, RCOG, ROCKET/Sepsis Six, NICE NG-series.
#
# Tier 1 = build first; clear decision tree, protocolised, high SAQ yield.
# Tier 2 = SAQ favourite, second-wave cases.
# Tier 3 = ambient board / future filler.
#
# Notes:
#   - paeds: yes — topic has paeds-specific variant in the syllabus.
#   - The 'arc_hooks' field flags narrative-link potential per build-prompt §
#     "intersecting arcs". These are seeds, not commitments.

version: 1
generated: 2026-05-18
generator: claude-opus-4.7 (manual synthesis from RCEM curriculum 2021 v1.5)
source_calibration:
  - id: rcem_curriculum_2021_v1_5
    type: pdf
    citation: 'Royal College of Emergency Medicine. Emergency Medicine 2021 Curriculum, v1.5, August 2025. Approved by GMC.'
    sections_consulted:
      [
        '3.2 SLOs (pp.17–58)',
        '3.3 Clinical Syllabus (pp.59–68)',
        '5 Programme of Assessment (pp.75–82)',
      ]
  - id: rcemlearning_public
    type: web
    citation: 'RCEMLearning public catalogue (https://www.rcemlearning.co.uk). Public-facing surface only. No member content used.'
    note: 'Site returned 503 to automated fetch on 2026-05-18; topic calibration relied on search-indexed page titles and editorial pieces (e.g. "A Guide to Conquering the FRCEM SBA").'

