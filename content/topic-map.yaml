    tier: 2
    curriculum_codes: [CC3]
    slos: [SLO1, SLO3]
    paeds: no
    rationale: 'Urgency vs emergency (end-organ damage = emergency). Targets: BP reduction 10–20% in 1 h. Labetalol IV; GTN for rapid onset. Avoid amlodipine (delayed onset = dose stacking).'
