# ─── Recommended first end-to-end case (build-prompt milestone 3) ────────────
recommended_first_case:
  id: anaphylaxis
  rationale: |
    Cleanest end-to-end loop of any candidate:
      - Protocolised single-pathway management (Resus Council UK 2021) keeps
        the decision tree tight enough to author fully in one milestone.
      - IM adrenaline timing is a clear clock-driven mechanic.
      - History → exam → ix → mx → debrief all fit cleanly into the
        per-encounter loop without leaning on the simulation kernel.
      - Adult and paeds doses both exist in the same algorithm — opens
        SLO5 variant for milestone 5 without re-authoring.
      - Maps to SLO1, SLO3, SLO5; codes RP2, AP1, AP2, AC1.
      - Strong examiner-trap material: biphasic reactions, cardiac arrest
        in upright posture (Pumphrey), refractory case glucagon, ACE-I
        bradykinin angioedema mimic.
  defer_after_milestone_3:
    - sepsis_adult # better second case — NEWS2 + Sepsis Six tests the simulation kernel
    - paeds_dka # good first paeds, links to safeguarding arc
    - major_trauma # earliest natural fit for the RTC shared-incident arc
