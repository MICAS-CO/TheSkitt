  # ─── Tier 1-2 topics surfaced by TheCase.Report podcast (S1-S6) ───────────
  - id: upper_gi_bleed
    label: Upper GI bleed (variceal + peptic)
    tier: 1
    curriculum_codes: [GP4, GC2]
    slos: [SLO1, SLO3]
    paeds: no
    rationale: 'Glasgow-Blatchford for risk stratification (<1 → safe outpatient), Rockall pre/post-endoscopy. Variceal: terlipressin + ceftriaxone prophylaxis (reduces mortality). Restrictive Hb 7–8 transfusion target. SALAD for soiled airway. SAQ regular.'
    sources:
      - {
          type: nice,
          id: 'CG141',
          ref: 'NICE CG141 — Acute upper gastrointestinal bleeding in over-16s: management',
        }
      - { type: rcem, ref: 'RCEM Best Practice — Upper GI Haemorrhage' }
