          type: textbook,
          ref: 'BSG/UK Guidelines on the management of variceal haemorrhage in cirrhotic patients (2015)',
        }
    arc_hooks: ['variceal bleed in known cirrhotic + alcohol withdrawal arc']
    inspiration: 'TheCase.Report S1E3 — Upper GI Bleed + SALAD'

