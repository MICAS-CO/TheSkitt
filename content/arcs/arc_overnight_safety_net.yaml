# Arc: Overnight Safety-Net
#
# Connects Chloe Davies (staggered paracetamol OD, M23) with Stan
# O'Brien (intoxicated witnessed fall, ambient since M8). Both
# present overnight to the same ED with a mental health subtext that
# previous ED visits failed to escalate. The thematic teaching point
# is NICE NG225 §1.3 — every self-harm / suspected-self-harm
# presentation needs a psychosocial assessment, and the system fails
# both patients when prior attendances do not feed forward.
#
# Mechanic: asking Chloe's records-trail history (hx_paeds_safeguarding,
# which already lists her own prior ED visit at H-6 months and the lack
# of MH follow-up) reveals a parallel pattern on Stan — a hidden
# history item surfacing his three ED attendances since bereavement
# all discharged with 'signposted to community alcohol team' and no
# liaison-psych contact.
#
# Type: shared_incident — both are the same overnight psychiatry
# on-call team, both have the same system-failure narrative.
#
# Sources: NICE NG225 self-harm guidance (Sep 2022).

schema_version: 1
id: arc_overnight_safety_net
type: shared_incident
title: "Overnight: the safety net both fell through"

internal_summary: |
  Chloe (paracetamol staggered OD) and Stan (intox + witnessed fall)
  share the same overnight on-call psychiatry team and the same
  pattern of prior ED visits that never connected to mental health
  follow-up. The arc reveals Stan's prior MH-flagged attendances
  once the player has done Chloe's records pull.

  This is author-only context; never shown to the player.

cases:
  - case_paracetamol_od_chloe
  - case_intox_stan_ambient

reveals:
  - id: reveal_chloe_records_pulled
    on: history_asked
    in_case_id: case_paracetamol_od_chloe
    history_id: hx_paeds_safeguarding

  # Fallback time reveal so the parallel isn't missed if the player
  # never asks for Chloe's records.
  - id: reveal_clock_t14
    on: clock_time
    t_min: 14

effects:
  - on_case_id: case_intox_stan_ambient
    unlocks_history_id: hx_stan_prior_mh
    note: |
      Records show Stan has had three ED attendances since bereavement
      (Mar / Jul / Oct 2024) — each discharged with alcohol-team
      signposting only. No liaison-psych contact. Apply NICE NG225
      thinking here too: this is the missed safety net.
