# Single-case 25-min shift around Amir Hassan — 8 y/o, first-
# presentation paediatric DKA, severe (BSPED 2020 criteria). Teaching
# axis is the paediatric-vs-adult dose-band trap, with cerebral-oedema
# vigilance as the secondary theme.

schema_version: 1
id: ep_paeds_dka_solo
title: 'Paediatric DKA — first presentation'

learning_objectives:
  - 'Apply BSPED 2020 paediatric DKA: 10 mL/kg saline bolus (NOT 20), 48-h deficit replacement (NOT 24 h), insulin 1 hour AFTER fluids (NOT concurrent), no insulin bolus, no bicarbonate.'
  - 'Calculate severity (BSPED): pH <7.1 OR HCO3 <5 + ketones >3 = severe → PICU/HDU + hourly neuro obs for 24 h.'
  - 'Recognise cerebral oedema as the leading paediatric DKA mortality cause (0.5–1%, peaks 4–12 h). Headache, falling GCS, bradycardia + hypertension → 3% hypertonic saline 2.5–5 mL/kg OR mannitol 0.5–1 g/kg.'
  - 'Calculate corrected sodium (Na + 0.4 × (gluc − 5.5)) — falling during treatment is the cerebral-oedema warning.'
  - 'Engage diabetes specialist nurse in ED for new-onset T1DM (reduces later DKA readmission rate).'

curriculum_tags: [EnC2, GC3]
difficulty_band: ST3
shift_duration_min: 25

focus_cases:
  - case_paeds_dka_amir

ambient_cases: []

