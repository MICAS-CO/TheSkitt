arcs: []

author_notes: |
  Single-case 25-min shift. Two parallel teaching axes:
  (a) dose-band discipline (10 mL/kg, 48-h, insulin H+1, no bolus,
  no bicarb) and (b) cerebral-oedema vigilance (hourly neuro obs,
  corrected-Na monitoring).

  The sequence-aware penalty (mx_paeds_insulin_1h_after has
  prereq_action_ids: [mx_paeds_saline_bolus]) means starting
  insulin before fluids triggers a sequence error — exactly the
  BSPED-vs-JBDS-IP teaching point.
