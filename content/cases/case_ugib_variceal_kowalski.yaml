author_notes: |
  Designed as a Tier-1 SAQ-classic with three current evidence pivots
  the previous-generation textbook misses: HALT-IT (no TXA in UGIB),
  Villanueva NEJM 2013 (restrictive transfusion in variceal), and
  the ceftriaxone-prophylaxis mortality reduction.

  Pairs naturally with the proposed liver_cirrhosis_decompensated
  topic for a future "alcoholic with everything" 2-case shift, or
  with the proposed alcohol_withdrawal topic as a follow-on at T+6
  if Mr Kowalski survives the bleed.

  Inspiration: TheCase.Report S1E3 — Upper GI Bleed + SALAD.
