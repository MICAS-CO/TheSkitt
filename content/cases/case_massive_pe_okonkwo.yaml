# Massive (high-risk) pulmonary embolism with haemodynamic instability
# requiring thrombolysis decision. Ms Okonkwo is 39, day-12 post-
# laparoscopic hysterectomy, on the COCP (restarted at her day-7
# post-op visit by a locum GP who didn't see the recent operation
# note; the discharge LMWH stopped the same day per the discharge
# letter). She presents in resus with shock-state vitals, syncope on
# standing, RV-strain ECG, dilated RV on POCUS, and a bedside Wells
# of 9. The shift is the textbook massive-PE decision:
# CTPA vs immediate bedside thrombolysis when the patient is too
# unstable for the scanner.
#
# Sources: NICE NG158 (Venous thromboembolic diseases), 2019 ESC
# Guidelines for the management of acute PE (Konstantinides et al.),
# PESI / sPESI for mortality stratification, BTS 2018 outpatient
# PE guideline (low-risk pathway), Oxford Handbook of EM 5e.

schema_version: 1
id: case_massive_pe_okonkwo
title: 'Massive PE — post-op syncope and right heart strain'
chief_complaint: 'Acute dyspnoea and syncope'
topic_id: pe

vignette: |
  Resus bay 1. 14:24.

  Ms Adaeze Okonkwo, 39 y/o, brought in by ambulance after collapsing
  in the supermarket carpark 20 minutes ago. Day 12 post-laparoscopic
  hysterectomy for fibroids. The witness — her sister — says
  Ms Okonkwo "went grey and crumpled" walking back to the car. Brief
  LOC <30 s, no jerks, no tongue bite, came round on the floor.

  Paramedics: "On scene she was sitting up, sweating, breathing fast.
  HR 124 sinus, BP 84/52 — improved to 92/58 with 250 mL saline
  bolus. Sats 86% on air, came up to 92% on 15 L NRB. Complaining of
  left-sided pleuritic chest pain. ECG shows sinus tach with S1Q3T3
  pattern and TWI in V1-V3."

  As you arrive she is anxious, tripoding on the trolley, RR 32,
  pulse oximeter still reading 92% on NRB, BP cuff redoing — 86/54.
  Her sister is at the bedside, on the phone to their mother.

curriculum_tags: [ResC10, CP2]
slos: [1, 3]
difficulty_band: ST3
paeds: false

