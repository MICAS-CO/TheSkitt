author_notes: |
  Designed as the SAQ-classic shock-state high-risk PE with a clean
  thrombolysis decision pivot. Demographics chosen to surface the
  COCP + post-op + family-history risk-factor stack that trainees
  must learn to triangulate.

  The locum-GP COCP detail is deliberately plausible and clinically
  rich — flags the need for record-linking + medication
  reconciliation in post-op patients.

  Pairs naturally with case_aortic_dissection_okafor in a future
  "chest pain + shock differential" double-bill: same presenting
  symptoms (chest pain + shock + raised troponin), opposite
  management (thrombolysis vs aortic-flap control).

  Inspiration: TheCase.Report S3E1 — VTE | PE in Pregnancy and
  COVID-19 | VTE Prophylaxis. Player-facing citations remain NICE
  NG158 + ESC 2019 + ADJUST-PE + PERC + McConnell + BTS 2018.
