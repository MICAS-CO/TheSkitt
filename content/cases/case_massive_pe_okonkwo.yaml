    - 'Hypertension (well-controlled on ramipril)'
    - 'BMI 31'
  medications:
    - 'Ramipril 5 mg OD'
    - 'COCP (microgynon) — restarted at day-7 post-op GP review (5 days ago, locum GP, not aware she had recent surgery)'
    - 'Enoxaparin 40 mg SC OD for 7 days post-op (stopped at day 7 per discharge letter — discharge thromboprophylaxis duration is the SAQ teaching point)'
    - 'Paracetamol PRN for post-op'
  allergies: ['NKDA']
  social: |
    Lives with husband and two children. Office worker — sedentary
    desk job. Non-smoker. Sister on scene. Two children at school,
    husband at work but called.

