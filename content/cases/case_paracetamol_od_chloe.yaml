history:
  - id: hx_paramedic
    source: paramedic
    topic: 'Full handover from the ambulance crew.'
    supports: ['Staggered paracetamol overdose with potential acute liver failure']
    response: |
      "999 call from her housemate at 02:54. On scene 03:08. Chloe was
      sitting on the bathroom floor, holding her abdomen. GCS 15.
      Pulse 84 reg, BP 118/72, sats 99% air, BM 5.6. She tells us
      she's taken 'some' paracetamol. Empty blister sleeves on the
      tiles. The housemate counted 32 tablets gone (16 g). She says
      Chloe's been low for weeks. We've put 16 G in the left ACF, no
      treatment given en route except 250 mL saline. No vomit."

  - id: hx_chloe_ingestion
    source: patient
    topic: 'Chloe — what did you take, and when?'
    npc_voice: "Chloe doesn't look up. Her voice is small."
    supports: ['Staggered paracetamol overdose with potential acute liver failure']
    response: |
      "I took eight at about ten last night. Then four more around
      one. Then… I don't know, maybe twelve more, just before Mira
      came in. I drank some wine. I didn't have anything else.
      I don't really know why I'm here. I'm sorry."
      (Tearful, holding her arms tightly across her abdomen.)

  - id: hx_chloe_other_drugs
    source: patient
    topic: 'Any other tablets, recreational drugs, herbal supplements?'
    prereq_history_ids: [hx_chloe_ingestion]
    response: |
      "Just my sertraline. I take it in the morning. I haven't taken
      it today. No recreational drugs. No herbal stuff. Nothing
      else, I promise."

  - id: hx_chloe_intent
    source: patient
    topic: 'Help me understand — what was going through your mind tonight?'
    prereq_history_ids: [hx_chloe_ingestion]
    npc_voice: "She closes her eyes. A long pause."
    supports: ['Self-poisoning with suicidal intent (clinical risk)']
    branch_choices:
      - id: compassionate
        label: "Take your time. Whatever you tell me stays between us and the team looking after you."
        npc_voice: "Her shoulders drop. She turns her face toward you for the first time."
        rapport_delta: 2
        response: |
          "I planned it. For weeks. I just wanted it to stop —
          the noise in my head. I knew about paracetamol from a
          training module at work. I'm not sorry I did it. I'm
          sorry Mira found me."
      - id: clinical
        label: "Was this an attempt to end your life, or to feel better?"
        npc_voice: "(She blinks once. Eyes back on the ceiling.)"
        rapport_delta: 0
        response: |
          "An attempt. I knew the dose. I took it in stages because
          I kept being sick. Mira found me."
      - id: deflecting
        label: "Sounds like you've had a tough night. Lots of people do this and regret it."
        npc_voice: "(She turns her face to the wall. The silence stretches.)"
        rapport_delta: -2
        response: |
          "...Yeah. Tough night."
    response: |
      "I just wanted it to stop. The noise in my head. I planned to
      take them all but I couldn't do it in one go, I kept being
      sick. I'm not sorry I did it. I'm sorry Mira found me."

  - id: hx_chloe_aftercare
    source: patient
    topic: '(quiet, after the intent disclosure) Is there anyone you want me to call?'
    prereq_history_ids: [hx_chloe_intent]
    min_rapport: 1
    npc_voice: "She doesn't open her eyes. A long pause."
    supports: ['Self-poisoning with suicidal intent (clinical risk)']
    response: |
      "Mira's outside. Don't call my mum yet. (Beat.) There's a
      mentor — Sami, from the safeguarding team at work — they
      know how to reach me. I'd rather they came than my mum.
      Please. Not my mum."

  - id: hx_housemate
    source: family
    topic: 'Speak to Mira in the relatives’ room.'
    npc_voice: "Mira hasn't put the blister sleeves down. She's still wearing pyjamas."
    supports: ['Staggered paracetamol overdose with potential acute liver failure']
    branch_choices:
      - id: compassionate
        label: "Mira — sit down. Whatever you tell me now, you're not in trouble, and Chloe isn't either. What did you see?"
        npc_voice: "Mira sits. The blister sleeves are still in her lap. She puts them on the table only when she starts talking."
        rapport_delta: 2
        response: |
          "She bought the 32-pack from the corner shop last
          Wednesday — I saw her with it and I asked her why and she
          said it was for her headaches. She's been weird for two
          weeks. Not eating. Crying at night through the wall. She
          broke up with someone last month. I tried — I asked, three
          times, I asked. She wouldn't talk to me. (Beat.) Tonight
          I heard her throwing up at midnight, and again at half-two,
          and that's when I went in. The packs were all popped out.
          She told me she'd taken 'most of them, spread out'. I
          dialled 999 immediately. (Pause.) I should have said
          something earlier. I should have made her see someone."
      - id: clinical
        label: "How many did she take, over what time, and when did you find her?"
        rapport_delta: 0
        response: |
          "Bought 32 last Wednesday. Tonight I heard her vomiting at
          midnight and 02:30. Found her at 02:50 on the bathroom
          floor — empty packs, all popped out. She said 'most of
          them, spread out'. I called 999."
      - id: investigative
        label: "Mira — were you aware she was struggling? Did she tell anyone?"
        npc_voice: "Mira looks down at the blister sleeves. Her hands tighten on them."
        rapport_delta: -2
        response: |
          "I — yes. I knew she was struggling. I should have done
          more. (Pause.) I'm sorry."
    response: |
      Mira reports a 2-week prodrome of low mood, anorexia and nocturnal
      crying, a recent break-up, and tonight a witnessed pattern of
      vomiting twice (midnight, 02:30) before she found Chloe on the
      bathroom floor with empty blister packs. Chloe told her she had
      taken 'most of them, spread out'. Mira called 999.

  - id: hx_paeds_safeguarding
    source: records
    topic: 'Pull the medical / university records.'
    prereq_history_ids: [hx_housemate]
    response: |
      "GP record: anxiety, sertraline started 3 months ago. One ED
      attendance 6 months ago — 'low mood, vague suicidal ideation,
      declined admission, signposted to university wellbeing service'.
      No discharge summary from that visit beyond the IRMER form.
      University wellbeing service: no contact in 4 months. Last
      LFTs (6 weeks ago, pre-sertraline): all normal."

  - id: hx_pregnancy
    source: patient
    topic: 'Any chance of pregnancy?'
    response: |
      "No. I have a coil. Last period was two weeks ago."

  - id: hx_dnacpr
    source: records
    topic: 'Resus status / advance care planning?'
    response: |
      "No advance directive. No DNACPR. Next-of-kin listed: mother
      (in Brighton, listed-as-estranged-since-November). Mira is
      named as a contact on the university registration."

