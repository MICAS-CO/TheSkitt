investigations:
  - id: ix_vbg
    name: 'Venous blood gas + lactate'
    category: gas
    turnaround_min: 5
    abnormal: true
    result_summary: |
      pH 7.36, pCO₂ 5.3 kPa, HCO₃ 22, BE −2.0, lactate 2.4, glucose 5.4.
      (Mild lactate rise; near-normal acid–base — does not exclude OD.)
    supports: ['Staggered paracetamol overdose with potential acute liver failure']

  - id: ix_paracetamol_level
    name: 'Serum paracetamol level (timed)'
    category: blood
    turnaround_min: 60
    essential: true
    abnormal: true
    result_summary: |
      Paracetamol 84 mg/L at 4 h post-LAST ingestion (claimed 02:30).
      ⚠ STAGGERED OD — the Rumack-Matthew nomogram does NOT apply.
      Treat with full NAC regardless of level (MHRA 2012, TOXBASE 2026).
    supports: ['Staggered paracetamol overdose with potential acute liver failure']
    sources:
      - { type: toxbase, ref: 'TOXBASE Paracetamol monograph — staggered overdose section' }
      - {
          type: other,
          ref: 'MHRA Drug Safety Update Sep 2012 — paracetamol IV NAC dose simplification',
        }

  - id: ix_salicylate_level
    name: 'Serum salicylate level'
    category: blood
    turnaround_min: 45
    abnormal: false
    result_summary: |
      Salicylate <100 mg/L (negative).
      (Always co-test for salicylate in any deliberate self-poisoning.)

  - id: ix_lfts
    name: 'LFTs (ALT, AST, ALP, bilirubin, albumin)'
    category: blood
    turnaround_min: 60
    essential: true
    abnormal: false
    result_summary: |
      ALT 38 IU/L, AST 32, ALP 78, bilirubin 12 µmol/L, albumin 38 g/L.
      Baseline LFTs normal — peak ALT rise typically 24-72 h
      post-ingestion. Repeat at 12 and 24 hours.
    supports: ['Staggered paracetamol overdose with potential acute liver failure']

  - id: ix_coag
    name: 'Coagulation screen (PT/INR, APTT)'
    category: blood
    turnaround_min: 60
    essential: true
    abnormal: false
    result_summary: |
      INR 1.1, APTT 28 s. Baseline. INR >2 by 24 h, or rising INR is
      the most sensitive marker for paracetamol-induced acute liver
      failure (King's College criteria).
    supports: ['Staggered paracetamol overdose with potential acute liver failure']

  - id: ix_fbc_ues
    name: 'FBC + U&E'
    category: blood
    turnaround_min: 45
    essential: true
    abnormal: false
    result_summary: |
      Hb 132, WCC 7.4, plts 245. Na 138, K 4.0, urea 4.2, creatinine
      62 (eGFR >90). No early AKI; recheck at 12 h.

  - id: ix_glucose
    name: 'Capillary blood glucose'
    category: bedside
    turnaround_min: 0
    abnormal: false
    result_summary: |
      BM 5.4 mmol/L. (Hypoglycaemia is a late ALF sign — monitor q1h
      while NAC is running and check at 12 / 24 h.)

  - id: ix_paeds_urine_drug_screen
    name: 'Urine drug screen + urine βhCG'
    category: urine
    turnaround_min: 30
    abnormal: false
    result_summary: |
      Drug screen: SSRI positive (expected, sertraline). Cannabis
      negative. Opiates negative. Cocaine negative. Benzos negative.
      Urine βhCG: negative.

  - id: ix_ecg
    name: '12-lead ECG'
    category: ecg
    turnaround_min: 5
    abnormal: false
    result_summary: |
      Sinus rhythm 88/min. PR 156 ms. QRS 90 ms. QTc 412 ms (normal).
      No ST/T changes. (Important to rule out QT prolongation given
      sertraline + ?co-ingestants.)

differential:
  - diagnosis: 'Staggered paracetamol overdose with potential acute liver failure'
    likelihood: top
    discriminator: |
      Ingestion in two or more doses spanning >1 h, total >75 mg/kg
      (Chloe ~16 g / 58 kg = 276 mg/kg — well above 75 mg/kg threshold).
      Cannot use the Rumack-Matthew nomogram. Treat with full NAC
      regardless of level.
  - diagnosis: 'Acute (single-time) paracetamol overdose'
    likelihood: must_not_miss
    discriminator: |
      Single ingestion at a defined time — would allow 4-hour
      paracetamol level + nomogram. The trap here is mis-categorising
      this as acute and waiting for the 'plot-able' level instead of
      starting NAC.
  - diagnosis: 'Mixed overdose (paracetamol + TCA / salicylate / opioid)'
    likelihood: must_not_miss
    discriminator: |
      Always co-test salicylate and check ECG for QRS widening / QT
      prolongation, and pupils / GCS for opioid pattern. Chloe is on
      sertraline (SSRI) — note serotonin syndrome possibility,
      especially with tramadol or other SSRIs.
  - diagnosis: 'Acute viral hepatitis (A / B / E) with incidental tablet ingestion'
    likelihood: worth_considering
    discriminator: |
      Pre-existing jaundice, transaminitis at presentation, hepatitis
      serology positive. Chloe's baseline LFTs were normal 6 weeks
      ago. Unlikely.
  - diagnosis: "Wilson's disease / autoimmune hepatitis presenting acutely"
    likelihood: unlikely
    discriminator: |
      Younger patient with new-onset liver failure — caeruloplasmin,
      copper, ANA, ASMA on follow-up if LFTs derange and no clear
      paracetamol exposure. Not the leading explanation here.
  - diagnosis: 'Self-poisoning with suicidal intent (clinical risk)'
    likelihood: top
    discriminator: |
      Stated intent at time of ingestion + history of self-harm scars
      + worsening mood over weeks + no MH follow-up. This sits
      alongside the medical diagnosis — both must be managed before
      medical discharge (NICE NG225).

working_diagnosis: 'Staggered paracetamol overdose with potential acute liver failure'

management:
  - id: mx_a_to_e
    category: monitoring
    name: 'ABCDE assessment + monitoring (continuous SpO2, ECG, NIBP every 15 min)'
    must_do: true
    resus_letter: A
    sources:
      - { type: rcem, ref: 'RCEM Best Practice — Paracetamol Overdose' }

  - id: mx_iv_access_bloods
    category: procedure
    name: 'Two large-bore IV cannulae + bloods (paracetamol, salicylate, LFT, coag, FBC, U&E, glucose, gas, βhCG)'
    must_do: true
    resus_letter: C
    detail: |
      Send paracetamol level no earlier than 4 h post-last-ingestion
      for documentation, but DO NOT wait for it to start NAC in a
      staggered overdose.

  - id: mx_iv_nac
    category: drug
    name: 'IV N-acetylcysteine (NAC) — SNAP regimen, start immediately'
    must_do: true
    resus_letter: C
    drug:
      amount: '100 mg/kg over 2 h, then 200 mg/kg over 10 h (SNAP simplified regimen)'
      route: IV
      frequency: 'continuous infusion (12 h total)'
    detail: |
      Adult dose. SNAP regimen (Scottish/New Antidote Protocol) is
      simpler than the legacy 3-bag and reduces anaphylactoid
      reactions. In staggered OD, start NAC regardless of paracetamol
      level (MHRA Drug Safety Update Sep 2012; TOXBASE 2026).
    sources:
      - { type: toxbase, ref: 'TOXBASE Paracetamol monograph — staggered overdose section' }
      - {
          type: other,
          ref: 'MHRA Drug Safety Update Sep 2012 — IV acetylcysteine treatment of paracetamol overdose',
        }

  - id: mx_pregnancy_test
    category: monitoring
    name: 'Send urine βhCG'
    must_do: true

  - id: mx_psych_assessment
    category: communication
    name: 'Refer for psychosocial assessment (NICE NG225) — liaison psychiatry or local mental health team'
    must_do: true
    detail: |
      Every self-harm presentation receives a psychosocial assessment
      before medical discharge. Treat compassionately; do not delay
      the medical treatment while waiting for psych input.
    sources:
      - {
          type: nice,
          id: 'NG225',
          ref: 'NICE NG225 Self-harm: assessment, management and preventing recurrence (Sep 2022)',
        }

  - id: mx_hepatology_referral
    category: referral
    name: 'Refer to hepatology / NPIS — discuss if INR >2.0 or rising at 12 h'
    must_do: true
    detail: |
      Early hepatology liaison even before INR rises — they will
      advise on King's College Hospital transfer if the patient meets
      transplant criteria (pH <7.30 OR INR >6.5 + creatinine >300
      + grade III–IV hepatic encephalopathy).
    sources:
      - { type: rcem, ref: 'RCEM Best Practice — Paracetamol Overdose' }

  - id: mx_glucose_monitoring
    category: monitoring
    name: 'Hourly capillary glucose for 24 h (treat <4 mmol/L with 10% dextrose)'
    must_do: true
    detail: |
      Hypoglycaemia is a late sign of fulminant hepatic failure.
      It also occurs from glycogen depletion in starvation /
      vomiting.

  - id: mx_repeat_lfts_inr
    category: monitoring
    name: 'Repeat LFTs + INR + U&E at 12 h and 24 h'
    must_do: true
    detail: |
      Peak ALT rise occurs 48–72 h. Trend INR — most sensitive
      indicator of impending ALF.

  - id: mx_iv_fluids
    category: fluid
    name: "IV maintenance crystalloid (Hartmann's 1 L over 8 h)"
    must_do: false
    resus_letter: C

  - id: mx_antiemetic_ondansetron
    category: drug
    name: 'IV ondansetron 4 mg STAT for vomiting'
    must_do: false
    drug: { amount: '4 mg', route: IV, frequency: 'STAT, repeatable q8h' }
    detail: |
      Note: ondansetron can prolong QT — Chloe's ECG showed QTc 412
      (normal), and a single dose is safe. Avoid if known long QT or
      concurrent QT-prolonging drugs.

  # ─── Distractors / examiner traps ─────────────────────────────────────────
  - id: mx_wait_for_level
    category: monitoring
    name: 'Wait for the 4-hour paracetamol level before starting NAC'
    must_not_do: true
    gated_by_history: [hx_chloe_ingestion]
    detail: |
      ❌ TRAP. In staggered overdose the nomogram does not apply and
      the level cannot tell you whether to treat. Starting NAC late
      worsens outcome. (MHRA 2012, TOXBASE 2026.)
    sources:
      - {
          type: other,
          ref: 'MHRA Drug Safety Update Sep 2012 — paracetamol IV NAC indication',
        }

  - id: mx_activated_charcoal
    category: drug
    name: 'Activated charcoal 50 g PO'
    must_not_do: true
    drug: { amount: '50 g', route: PO, frequency: 'STAT' }
    detail: |
      ❌ Only useful within 1 h of ingestion. Last dose >1 h ago.
      Risk of aspiration in a drowsy patient.
    sources:
      - { type: toxbase, ref: 'TOXBASE Paracetamol monograph — decontamination section' }

  - id: mx_discharge_after_4h
    category: disposition
    name: 'Discharge once she is symptom-free at H+4'
    must_not_do: true
    detail: |
      ❌ TRAP. Staggered OD ≠ acute OD. Even if she looks well, the
      hepatic injury may not declare itself until 24–72 h. NICE NG225
      also requires a psychosocial assessment before discharge —
      cannot leave without it.
    sources:
      - { type: nice, id: 'NG225', ref: 'NICE NG225 §1.3 admission for assessment' }

  - id: mx_stop_sertraline
    category: drug
    name: 'Stop the sertraline pending hepatology review'
    must_not_do: true
    detail: |
      Not the ED's call. Sertraline is hepatically metabolised but
      stopping abruptly causes discontinuation syndrome — flag for
      the inpatient team / hepatology to weigh up.

disposition_options:
  - label: 'Admit medical / acute medicine with hepatology input + liaison psychiatry'
    criteria: |
      Staggered overdose >75 mg/kg + active suicidal intent. Continue
      NAC, hourly glucose, 12/24-h LFT trend, psychosocial assessment,
      then plan based on hepatology + psych recommendations.
    appropriate: true
    epilogue: "Sami from her safeguarding team arrives at 09:30. Her mum is not called yet. Chloe sleeps with the NAC running."
  - label: 'Admit MAU for observation only — discharge once asymptomatic'
    criteria: |
      Misses the psychosocial assessment requirement and the
      requirement to trend LFTs + INR at 12 / 24 h to detect ALF.
    appropriate: false
    epilogue: "Hepatology decline review without active management. At 14:00 her INR is 2.4."
  - label: 'Discharge once medically stable with GP follow-up'
    criteria: |
      ❌ Inappropriate — staggered OD with active suicidal intent
      cannot be safely discharged from ED. NICE NG225 mandates a
      psychosocial assessment before discharge. Hepatic injury may
      declare itself 24–72 h post-ingestion.
    appropriate: false
    epilogue: "She is back through the door at 21:00 with jaundice. Her ALT is 4,200."
  - label: "Transfer to King's College Hospital liver unit now"
    criteria: |
      Premature without King's criteria met (pH <7.30 OR INR >6.5 +
      creatinine >300 + grade III–IV hepatic encephalopathy). Early hepatology liaison is correct;
      transfer is reserved for those who meet criteria, usually after
      12–24 h of NAC.
    appropriate: false
    epilogue: "King's hepatology accepts the referral as advisory only. 'Get the NAC running first, then call us back at 12 hours.' The ambulance is stood down."

state_machine:
  states: [stable, deteriorating, arrested, admitted, discharged]
  transitions:
    - from: stable
      to: deteriorating
      trigger:
        on: inaction_by
        min: 12
        required_actions: [mx_iv_nac]
        note: |
          NAC not started by H+12 — liver injury declares itself, INR
          rises and patient deteriorates.
    - from: stable
      to: admitted
      trigger:
        on: action
        action_id: mx_hepatology_referral
        note: 'Hepatology accepted for medical admission with NAC and psychiatric review.'
    - from: deteriorating
      to: admitted
      trigger:
        on: action
        action_id: mx_iv_nac
        note: |
          Even after early hepatic injury declares, NAC + hepatology
          rescue the case — escalate to admission rather than abandon.
    - from: deteriorating
      to: arrested
      trigger:
        on: inaction_by
        min: 18
        required_actions: [mx_iv_nac, mx_hepatology_referral]
        note: |
          Fulminant hepatic failure without rescue — multi-organ
          failure and cardiac arrest.

pearls:
  - 'Staggered paracetamol OD = NAC regardless of level. The Rumack-Matthew nomogram only applies to a single acute ingestion at a known time. (MHRA Drug Safety Update Sep 2012; TOXBASE Paracetamol monograph 2026.)'
  - 'SNAP regimen for IV NAC (100 mg/kg over 2 h, then 200 mg/kg over 10 h) replaced the legacy 3-bag protocol — same efficacy, fewer anaphylactoid reactions, simpler bag-changes.'
  - "INR is the most sensitive marker of paracetamol-induced acute liver failure. Rising INR before bilirubin or transaminases climb — refer hepatology early."
  - "King's College Hospital criteria for transplant referral: arterial pH <7.30 OR (INR >6.5 + creatinine >300 µmol/L + grade III–IV encephalopathy)."
  - 'Every self-harm presentation receives a psychosocial assessment before medical discharge (NICE NG225). The medical and psychiatric pathways run in parallel, not in series.'
  - 'Always co-send a salicylate level in deliberate self-poisoning — concealed mixed overdose is common.'

pitfalls:
  - "Treating staggered OD with the nomogram. A paracetamol level >4 h post-LAST ingestion in a staggered case tells you nothing about treatment threshold — start NAC."
  - 'Discharging the symptom-free patient at H+4 because they "look well". The hepatic injury declares itself at 24-72 h.'
  - 'Activated charcoal beyond the 1-hour window — aspiration risk in a drowsy patient with no benefit.'
  - 'Forgetting the safeguarding piece. NICE NG225 makes the psychosocial assessment mandatory before discharge.'
  - 'Misjudging dose-per-kilogram in a smaller patient. 16 g in a 58 kg patient is 276 mg/kg — well into hepatotoxic territory even before considering the staggered pattern.'

