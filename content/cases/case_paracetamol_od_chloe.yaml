author_notes: |
  This case sits at the intersection of toxicology and mental health.
  The teaching pattern is twofold: (a) the staggered-vs-acute trap
  (start NAC regardless of level when staggered), and (b) the
  parallel medical + safeguarding pathway. Both must be addressed
  before discharge.

  Narrative hook for future arcs: Chloe's prior ED attendance for low
  mood (6 months ago) and her estrangement from family pair her well
  with a "missed safety-net" arc — could connect with a community
  mental health crisis case, or a paediatric self-harm presentation
  on the same shift to surface NICE NG225 themes systemically.
