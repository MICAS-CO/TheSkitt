# Authored against TOXBASE Paracetamol monograph (May 2026), MHRA Drug
# Safety Update Sep 2012 (single-/staggered- overdose NAC rules), NICE
# NG225 Self-harm: assessment, management and preventing recurrence
# (Sep 2022), and RCEM Best Practice Paracetamol Overdose.
#
# Chloe Davies — 19 y/o student, staggered paracetamol overdose over
# 5 hours, found by housemate at 03:00. The teaching pattern is the
# staggered-vs-acute trap:
#  - acute single ingestion → 4-hour paracetamol level → Rumack-Matthew
#    nomogram → NAC if above the treatment line
#  - staggered → paracetamol level CANNOT be plotted; treat with NAC
#    regardless of level
#
# Secondary themes:
#  - safeguarding / mental health (NICE NG225 — every self-harm
#    presentation gets a psychosocial assessment before medical
#    discharge)
#  - hepatology referral threshold (King's College Hospital criteria)
#  - the "she's well, can she go home?" temptation at H+4

schema_version: 1
id: case_paracetamol_od_chloe
title: 'Paracetamol overdose — staggered, university student'
chief_complaint: '?Paracetamol overdose · staggered'
topic_id: paracetamol_od

vignette: |
  Majors bed 6. 03:42.

  Chloe Davies, 19 y/o, brought in by ambulance from her university
  halls. Housemate woke at 02:50 to find her sitting on the bathroom
  floor next to empty paracetamol blister packs and an open bottle of
  wine. Chloe is alert, mildly drowsy. Paramedics: "She says she took
  some last night and more 'a bit ago'. We've put a line in. No
  vomiting witnessed. No co-ingestants found in the room."

  Her housemate Mira is in the relatives' room, shaky, holding three
  blister sleeves with all 32 tablets popped out.

curriculum_tags: [PhP2, PhC1, MHP1]
slos: [1, 3, 2]
difficulty_band: ST3
paeds: false

demographics:
  age_value: 19
  age_unit: years
  sex: female
  weight_kg: 58
  pmh:
    - 'Generalised anxiety disorder (GP-managed, no current psychiatric follow-up)'
    - 'Migraine — uses paracetamol regularly'
  medications:
    - 'sertraline 50 mg OD (started 3 months ago)'
    - 'paracetamol PRN'
  allergies: ['NKDA']
  social: |
    Second-year English literature student. Lives in shared flat with
    Mira. No regular alcohol; "two glasses of wine on a bad day".
    Estranged from family for 6 months — won't say more.

triage_category: 2
initial_state: stable
bay: majors

