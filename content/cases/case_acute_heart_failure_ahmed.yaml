author_notes: |
  Designed as the SAQ-classic wet-and-warm decompensated heart
  failure. The pre-op-clinic diuretic-hold precipitant is a recurring
  cause that trainees should learn to suspect and document.

  Three teaching pivots:
  1. Wet-and-warm = NIPPV + vasodilator + diuretic. No fluid. No
     morphine.
  2. Diuretic dosing for chronic users = at least the usual oral
     24-h dose converted IV.
  3. Stop-the-diuretic-before-surgery is the audit-bait that gets
     these patients into the ED.

  Pairs naturally with case_chest_pain_patel_ambient (STEMI) and
  case_aortic_dissection_okafor (AD) as a "shortness of breath +
  chest pressure" differential — three different mechanisms behind
  the same presenting symptom.

  Inspiration: TheCase.Report S1E10 (Acute HF + Syncope) and S1E11
  (Prof Amal Mattu bonus). Player-facing citations remain NICE
  NG106 + ESC 2021 + 3CPO NEJM 2008 + BTS Oxygen 2017.
