# MILESTONE 5 — second case of deliberately different shape.
#
# Sarah came in the ambulance with her friend Beth (case_anaphylaxis_adult_peanut)
# from the hen-do dinner. While Beth was being resuscitated, Sarah was sitting
# in the relatives' room. She mentions cramping abdominal pain to a triage
# nurse — turns out she's 7 weeks pregnant with PV spotting.
#
# DIFFERENT SHAPE from Beth: looks well at triage (cat 3), obstetric system,
# time-critical despite low-acuity appearance. The deceptively-stable
# minors patient who is actually one ruptured tube away from arrest.
#
# Authored against NICE NG126 (Ectopic pregnancy and miscarriage, 2019;
# updated 2023), RCOG Green-top 21 (Tubal Ectopic Pregnancy, 2016), and
# Oxford Handbook of EM 5e Ch 13.

schema_version: 1
id: case_ectopic_minors_sarah
title: 'Pelvic pain in early pregnancy — minors'
chief_complaint: 'Pelvic pain + PV spotting'
topic_id: ectopic_pregnancy

vignette: |
  Triage at 19:20.

  Sarah Mendez, 30 y/o, was sitting in the relatives' room when she
  asked the triage nurse if she could be seen. "It's probably nothing —
  I came in with my friend who's in resus — but I've been having this
  cramping pain in my belly all afternoon, and I had some bleeding this
  morning."

  She is talking in full sentences, walking unassisted. Last menstrual
  period was 7 weeks ago. Home pregnancy test positive last week.

  Triage nurse hands you the card: "cat 3 — abdo pain, ?early
  pregnancy. PV spot."

curriculum_tags: [ObC4, ObP1, ObP2, ObP3]
slos: [1, 3]
difficulty_band: ST3
paeds: false

