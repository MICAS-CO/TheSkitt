  age_value: 30
  age_unit: years
  sex: female
  weight_kg: 64
  gestation_weeks: 7
  pmh: ['previous chlamydia infection age 22 — treated']
  medications: ['folic acid 400 mcg daily since the positive test']
  allergies: ['NKDA']
  social: |
    Lives with partner Jamie. Software engineer. Non-smoker. Stopped
    alcohol after the positive pregnancy test last week. Bride-to-be —
    this is her hen-do dinner.

