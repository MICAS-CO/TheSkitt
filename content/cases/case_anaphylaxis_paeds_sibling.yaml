history:
  - id: hx_paramedics
    source: paramedic
    topic: 'Paramedic handover.'
    response: |
      "999 call at 20:14 — mum saw Beth was in for anaphylaxis and
      noticed Sam had been wheezy. We arrived at 20:25. Found him sat
      forward, audible wheeze, mild stridor on inspiration. Mum gave
      one of Beth's old EpiPens (300 mcg) at the door — he improved
      noticeably in transit. Sats 92 → 96, RR 36 → 28. Brought him in
      lying flat."

  - id: hx_lunch_timeline
    source: family
    topic: 'Mum — walk me through today.'
    supports: ['Paediatric anaphylaxis — peanut (food-IgE)']
    npc_voice: "Sam's mum is half-turned toward the trolley. She doesn't take her eyes off him as she talks."
    branch_choices:
      # Non-tonal fork (M55) — this is a *prioritisation* dilemma, not a
      # tone selector. The three options trade history-completeness
      # against time-to-treatment in different ways. There is no clean
      # 'right' answer; the cost of each is paid in a different
      # currency. The clinical bones still get to the player no matter
      # which one they pick — only the route differs.
      - id: now_full
        label: "Mum, two minutes — every detail of today, slowly, from when he woke up. I need it before we go further."
        npc_voice: "She makes herself stop watching Sam. She makes herself look at you. It is visibly difficult."
        rapport_delta: -1
        response: |
          "He woke at seven, normal breakfast — Weetabix, milk, no
          peanut. Lunch around 12:30: peanut-butter sandwich, same
          brand we always buy. Lip felt funny by half-two and looked
          a bit puffy. I gave him cetirizine. He settled. He played
          in his room all afternoon. Six o'clock — fish fingers and
          chips, no nuts. Seven thirty he came down wheezing and
          pale and I thought asthma. Then my phone went off — the
          messages about Beth. (Pause.) Can we — can we please go
          to him now?"
      - id: brief_then_treat
        label: "Quick: what did he eat, when did this start, anything before? Then I'm starting adrenaline."
        rapport_delta: 1
        response: |
          "Peanut butter sandwich at 12:30 — same brand always.
          Lip puffy at 14:30, gave cetirizine, settled. Wheezing and
          pale at 19:30. Then the Beth messages came in. Go. Go."
      - id: defer_to_nurse
        label: "Mum — Sam needs me right now. Sister, can you take a full history from Mum while I start?"
        npc_voice: "She nods immediately. The paeds nurse appears at her elbow with a notepad. The mum's shoulders come down a fraction."
        rapport_delta: 2
        response: |
          (The paeds nurse takes the history at the bay door. You hear
          fragments — 'peanut butter…', 'half-past-two…', 'cetirizine
          and he settled…', 'wheezing at half-seven and then she saw
          the messages…'. The nurse hands you the timeline on a
          sticky note four minutes later. The mum has not left
          Sam's side.)
    response: |
      "He had a peanut-butter sandwich for lunch about 12:30 — same
      brand we always buy. His lip felt funny by half-two and looked
      a bit puffy. I gave him cetirizine and he settled. He's eaten
      peanut butter before. He played in his room all afternoon. About
      half-past-seven he came down wheezing and pale — I thought
      asthma. Then I saw the messages about Beth."

  - id: hx_previous_reactions
    source: family
    topic: 'Has Sam ever had a reaction like this before?'
    prereq_history_ids: [hx_lunch_timeline]
    supports: ['Paediatric anaphylaxis — peanut (food-IgE)']
    response: |
      "Maybe? He's had hives once or twice. Eczema flares around his
      mouth when he eats certain things — I always thought it was
      tomato. There was Christmas before last when he was sick after a
      Snickers… we put it down to the chocolate being rich."

  - id: hx_asthma
    source: family
    topic: 'Tell me about his asthma.'
    supports: ['Acute severe asthma exacerbation', 'Viral wheeze']
    response: |
      "Diagnosed at 5. He has a salbutamol pump. Hasn't really used it
      this year — last time he wheezed was March. No nebulisers,
      never been admitted."

  - id: hx_mum_self_blame
    source: family
    topic: '(after the second IM adrenaline, with Sam stabilising) How are *you* doing, Mum?'
    prereq_history_ids: [hx_lunch_timeline]
    min_rapport: 1
    npc_voice: "Sam's mum has been standing in the same spot for thirty minutes. She doesn't sit when you ask. She does start to cry."
    supports: ['Paediatric anaphylaxis — peanut (food-IgE)']
    response: |
      "I gave him her sauce. (Pause.) Beth's. He saw it on her plate
      and asked, and I said 'just a little finger' because the
      waiter said it was fine. I — I — when they wheeled Beth past
      me into resus, I knew. I knew before he started coughing. I
      just stood there in A&E reception watching her go past on a
      trolley and I thought 'don't be peanut, please don't be
      peanut'. Then forty minutes later he started scratching his
      lip. (Breath.) Doctor — will I be allowed in there with him?
      When you… do whatever you need to do next? Please. I won't
      get in the way. I just can't be out here on my own with this."

  - id: hx_paeds_aware
    source: patient
    topic: 'Ask Sam directly — what does he feel right now?'
    prereq_history_ids: [hx_lunch_timeline]
    npc_voice: 'Sam looks up from the trolley, eyes wide and rimmed red.'
    response: |
      "My… my chest feels really tight. And my lip is fat. Mum, am I
      gonna die like in films?" (Anxious, but talking in short
      sentences.)

  - id: hx_pre_anaesthesia
    source: records
    topic: 'Quick pre-anaesthesia screen in case we need RSI.'
    response: |
      "Never had a GA. Last ate 12:30 (sandwich). No teeth issues.
      Allergies: ?peanut. Mum here for consent if needed."

examination:
  - system: paeds_assessment_triangle
    findings:
      - { name: 'appearance', value: 'anxious, alert, eye-contact maintained', present: true }
      - {
          name: 'work of breathing',
          value: 'increased — tracheal tug, subcostal recession, audible wheeze',
          present: true,
        }
      - {
          name: 'circulation to skin',
          value: 'flushed; widespread urticaria over trunk; lip swelling',
          present: true,
        }
  - system: airway
    findings:
      - { name: 'voice', value: 'audible inspiratory stridor; talking in short sentences' }
      - { name: 'lip and peri-oral swelling', present: true }
      - { name: 'tongue', value: 'mildly swollen; protrudes normally; no drooling' }
    manoeuvres:
      - id: paeds_airway_focused
        label: "Paeds-airway focused — count to 10, tongue inspection, lap position with Mum"
        findings:
          - {
              name: "stridor on the count of 5",
              value: "inspiratory, worsens under effort — dynamic airway oedema, not fixed obstruction",
              red_flag: true,
              supports: ['Paediatric anaphylaxis — peanut (food-IgE)'],
            }
          - {
              name: 'no drooling, no tripoding',
              present: false,
              pertinent_negative: true,
              value: "argues against epiglottitis as the differential",
            }
          - {
              name: 'comfortable in mum''s lap',
              value: "no air-hunger posture; settles when mum holds him — important if you need to defer iv access briefly",
            }
      - id: pefr
        label: 'Peak expiratory flow rate (if able to cooperate)'
        findings:
          - {
              name: 'PEFR 120 L/min (predicted 220 L/min for height)',
              value: '~55% predicted — moderate-severe asthma component on top of anaphylaxis',
              red_flag: true,
              supports: ['Paediatric anaphylaxis — peanut (food-IgE)', 'Acute severe asthma exacerbation'],
            }
  - system: breathing
    findings:
      - { name: 'respiratory rate', value: '28/min (paeds 6–12y normal 18–24)' }
      - { name: 'SpO2', value: '96% on 4 L nasal cannulae (was 92% on air)' }
      - { name: 'auscultation', value: 'symmetrical polyphonic wheeze, no focal consolidation' }
      - { name: 'accessory muscle use', value: 'sternocleidomastoids active', present: true }
  - system: circulation
    findings:
      - { name: 'heart rate', value: '142/min, sinus (paeds 6–12y normal 70–115)' }
      - {
          name: 'blood pressure',
          value: '94/58 mmHg (paeds lower limit ~5th centile for age = 80 systolic)',
        }
      - { name: 'capillary refill', value: '3 s peripherally' }
  - system: disability
    findings:
      - { name: 'GCS', value: '15 — alert, anxious, eye-contact good' }
      - { name: 'glucose', value: '5.6 mmol/L' }
      - { name: 'AVPU', value: 'A' }
  - system: exposure
    findings:
      - { name: 'temperature', value: '37.0 °C' }
      - { name: 'no other rash distribution', pertinent_negative: true }
      - { name: 'eczema patches in antecubital fossae', present: true }

investigations:
  - id: ix_paeds_obs
    name: 'Paediatric vital signs + weight'
    category: bedside
    turnaround_min: 1
    essential: true
    result_summary: |
      Weight 28 kg (paramedic measured). Obs as per examination —
      HR/RR above normal range for 8y; SpO2 corrected with O2; BP at
      lower end of normal.
    abnormal: true

  - id: ix_pefr
    name: 'Peak expiratory flow rate (best of 3)'
    category: bedside
    turnaround_min: 2
    result_summary: |
      120 L/min (Sam's previous best ~230 L/min per parent — ~52% of
      best). Acute severe asthma threshold per BTS/SIGN 158 (≤50%) just
      missed — but anaphylaxis-driven bronchospasm responds to
      adrenaline + nebs.
    abnormal: true

  - id: ix_vbg
    name: 'Venous blood gas + lactate'
    category: gas
    turnaround_min: 5
    result_summary: |
      pH 7.34 · pCO2 4.6 kPa · HCO3 19 · BE -3 · Lactate 2.1 · K 4.0 ·
      Glucose 5.6. Mild metabolic acidosis — improving after IM
      adrenaline.

  - id: ix_tryptase
    name: 'Mast cell tryptase — 3 samples (per Resus Council UK 2021)'
    category: blood
    turnaround_min: 60
    essential: true
    result_summary: |
      Sample 1 (presentation) drawn before further adrenaline.
      Sample 2 at 1–2 h. Sample 3 at 24 h (baseline). Same protocol as
      adults; paeds reference ranges apply.
    sources:
      - { type: resus_council_uk, ref: 'Anaphylaxis Guidelines 2021 — tryptase timing in children' }

  - id: ix_fbc_ue
    name: 'FBC, U&E, glucose'
    category: blood
    turnaround_min: 45
    result_summary: 'Hb 124 · WCC 13 (mild neutrophilia, stress) · Plt 280 · Na 138 · K 4.0 · Urea 4.4 · Creat 42 (normal for age). CRP 6.'

  - id: ix_ecg
    name: '12-lead ECG'
    category: ecg
    turnaround_min: 2
    result_summary: 'Sinus tachycardia at 142/min. No QT prolongation. No ischaemic change (not expected at his age).'

differential:
  - diagnosis: 'Paediatric anaphylaxis — peanut (food-IgE)'
    likelihood: top
    discriminator: |
      Diagnostic criteria (Resus Council UK 2021): rapid onset +
      life-threatening Airway (stridor, lip swelling) + Breathing
      (wheeze, SpO2 92% pre-O2) + skin/mucosal change. Sister
      concurrently in resus with the same trigger seals it.

  - diagnosis: 'Acute severe asthma exacerbation'
    likelihood: worth_considering
    discriminator: |
      Known asthma + wheeze + PEFR 52% best fits acute severe asthma.
      But isolated asthma doesn''t explain the urticaria, lip swelling,
      or stridor. Treat the anaphylaxis driver first.

  - diagnosis: 'Inhaled foreign body'
    likelihood: must_not_miss
    discriminator: |
      Sudden inspiratory stridor in a child is FB until proven otherwise.
      Here the timing (post-meal, urticaria, lip swelling, eczema
      history) and improvement on adrenaline points away — but
      always reassess if no response.

  - diagnosis: 'Hereditary angioedema (HAE)'
    likelihood: must_not_miss
    discriminator: |
      Bradykinin-mediated angioedema does NOT respond to adrenaline
      and has no urticaria. Family history and slower onset (over
      hours, not minutes) help — but Sam has urticaria, so HAE is
      unlikely.

  - diagnosis: 'Viral wheeze'
    likelihood: unlikely
    discriminator: "No fever, no preceding URTI, sudden onset post-food. Doesn't fit."

working_diagnosis: 'Paediatric anaphylaxis to peanut'

management:
  - id: mx_a_to_e_paeds
    category: monitoring
    resus_letter: A
    name: 'Paediatric ABCDE + continuous monitoring + paeds early warning score (PEWS)'
    detail: |
      Move to paeds resus; continuous SpO2, ECG, BP every 3 min, RR every
      5 min. Reassess after each intervention.
    must_do: true

  - id: mx_call_paeds_anaesthetics
    category: escalation
    name: 'Call paeds team and paeds anaesthetics; consider PICU pre-alert'
    detail: |
      Stridor with paeds anaphylaxis = airway risk. Paeds anaesthetics
      should know early in case RSI becomes necessary.
    must_do: true

  - id: mx_oxygen_paeds
    category: drug
    resus_letter: B
    name: 'High-flow O2 via paediatric non-rebreather (target SpO2 ≥94%)'
    detail: '15 L/min via paeds non-rebreather initially; titrate down to keep SpO2 ≥94%.'
    must_do: true
    drug:
      amount: '15 L/min then titrate'
      route: other
      frequency: 'continuous via paeds non-rebreather mask'
    sources:
      - { type: bts_sign, ref: 'BTS/SIGN 158 acute asthma sections (chronic mgmt now superseded by NICE NG244 Nov 2024) — oxygen in paeds acute asthma' }

  - id: mx_adrenaline_paeds_im
    category: drug
    resus_letter: C
    name: 'IM adrenaline — paediatric dose (8 y → 300 mcg)'
    detail: |
      Anterolateral mid-thigh. Sam already had one dose from his
      sister''s EpiPen pre-hospital. If symptoms persist, give a second
      dose 5 min after the first. Beyond 2 doses with persisting
      compromise → refractory anaphylaxis → IV adrenaline infusion
      under senior/anaesthetic supervision.
    must_do: true
    drug:
      amount: '300 micrograms (0.3 mL of 1:1000)'
      route: IM
      frequency: 'every 5 min PRN'
      paeds_dose: '<6 months 100–150 mcg · 6m–6 yr 150 mcg · 6–12 yr 300 mcg · >12 yr 500 mcg'
    sources:
      - {
          type: resus_council_uk,
          ref: 'Anaphylaxis Guidelines 2021 — paediatric IM adrenaline dose bands',
        }

  - id: mx_position_paeds
    category: procedure
    resus_letter: C
    name: 'Lay supine; if pregnant adolescent → left lateral tilt'
    detail: |
      For a hypotensive paeds anaphylaxis patient, lay supine with legs
      raised. If respiratory distress predominates and Sam wants to sit
      up, that''s OK while monitoring closely — never force a hypotensive
      patient to sit if it compromises preload (Pumphrey principle).
    must_do: true
    sources:
      - { type: resus_council_uk, ref: 'Anaphylaxis Guidelines 2021 — posture' }

  - id: mx_iv_access_paeds
    category: procedure
    resus_letter: C
    name: 'IV access (or IO if struggling) — take bloods + tryptase sample 1'
    detail: |
      Two attempts max at IV in a stable-ish patient before going IO.
      Sample 1 of mast cell tryptase from this draw.
    must_do: true

  - id: mx_iv_fluids_paeds
    category: fluid
    resus_letter: C
    name: 'IV crystalloid 10 mL/kg bolus, reassess (paeds dose, NOT adult 20)'
    detail: |
      280 mL of 0.9% saline or Hartmann''s over 5–10 min for Sam at
      28 kg. Reassess BP, HR, perfusion. Repeat if persistent shock.
      Note: paeds bolus is 10 mL/kg (Resus Council UK 2021), differs
      from the adult 500–1000 mL bolus.
    drug:
      amount: '10 mL/kg crystalloid'
      route: IV
      frequency: 'over 5–10 min, reassess'
    must_do: true
    sources:
      - {
          type: resus_council_uk,
          ref: 'Anaphylaxis Guidelines 2021 — paediatric fluid bolus 10 mL/kg',
        }

  - id: mx_nebulised_salbutamol_paeds
    category: drug
    resus_letter: B
    name: 'Nebulised salbutamol 5 mg (≥5 yr) for persistent wheeze'
    detail: |
      Adjunct only — does NOT replace IM adrenaline. Salbutamol back-to-
      back or 20–30 min as needed; ipratropium 250 mcg every 4–6 h if
      severe (NOT 20-minutely — anticholinergic load).
    drug:
      amount: '5 mg salbutamol neb (± ipratropium 250 mcg q4–6h if severe)'
      route: NEB
      frequency: 'salbutamol 20–30 min as needed or continuous; ipratropium 4–6 hourly'
    sources:
      - { type: bts_sign, ref: 'BTS/SIGN 158 acute asthma sections (chronic mgmt now superseded by NICE NG244 Nov 2024) — paediatric acute asthma nebuliser doses' }

  - id: mx_tryptase_paeds
    category: monitoring
    name: 'Mast cell tryptase — three timed samples'
    detail: 'Sample 1 at presentation, sample 2 at 1–2 h, sample 3 at 24 h. Same paeds protocol as adult.'
    must_do: true

  - id: mx_communicate_with_sister_team
    category: communication
    name: 'Coordinate with the resus team treating Beth'
    detail: |
      Family-wide reaction — same trigger, same household. Document the
      link in both notes for the allergy clinic referral.

  - id: mx_admit_paeds_obs
    category: disposition
    name: 'Admit paeds ward for risk-stratified observation period'
    detail: |
      Per Resus Council UK 2021: ALL paeds anaphylaxis are admitted for
      observation. Duration risk-stratified — ≥12 h if severe / required
      2 doses adrenaline / asthma history / biphasic risk.
    must_do: true

  # ─── Trap actions ──────────────────────────────────────────────────────────
  - id: mx_no_adult_dose
    category: drug
    name: 'Give adult dose (500 mcg) IM adrenaline'
    detail: |
      ❌ Sam is 8 — the correct dose is 300 mcg (6–12 yr). Adult dose
      risks arrhythmia and the dose bands exist for a reason.
    must_not_do: true

  - id: mx_no_chlorphenamine_first
    category: drug
    name: 'Give IV chlorphenamine first-line'
    detail: |
      ❌ Removed from first-line in Resus Council UK 2021. Adrenaline is
      the only first-line drug. Chlorphenamine may be considered AFTER
      stabilisation for symptomatic urticaria.
    must_not_do: true
    sources:
      - {
          type: resus_council_uk,
          ref: 'Anaphylaxis Guidelines 2021 — antihistamines/steroids no longer first-line',
        }

  - id: mx_no_inhaler_alone
    category: drug
    name: 'Give salbutamol from his own inhaler and treat as asthma'
    detail: |
      ❌ Anchoring on his asthma history. The urticaria, lip swelling, and
      response to IM adrenaline pre-hospital make this anaphylaxis;
      inhaled salbutamol alone treats only the bronchospasm component.
    must_not_do: true

  - id: mx_no_discharge_after_short_obs
    category: disposition
    name: 'Discharge home after one hour if symptoms settle, with cetirizine PRN'
    detail: |
      ❌ All paeds anaphylaxis admitted for risk-stratified observation
      per Resus Council UK 2021. Discharge without auto-injector +
      allergy clinic referral is a sentinel-event-grade decision.
    must_not_do: true

  - id: mx_no_iv_adrenaline_bolus
    category: drug
    name: 'Give IV adrenaline bolus while still responsive to IM'
    detail: |
      ❌ IV adrenaline boluses risk arrhythmia and are reserved for
      cardiac arrest. Refractory anaphylaxis (no response to 2 IM
      doses) is treated with an IV INFUSION under senior supervision —
      not bolus dosing.
    must_not_do: true

disposition_options:
  - label: 'Admit paeds ward for risk-stratified observation (minimum 12 h)'
    criteria: |
      Severe reaction + asthma history + 1 IM adrenaline dose +
      potential biphasic risk. Standard paeds anaphylaxis disposition.
    appropriate: true
    epilogue: "Mum is allowed to sleep in the chair. She does not sleep."
  - label: 'Discharge home with allergy clinic referral and 2× EpiPen Jr (150 mcg)'
    criteria: |
      Inappropriate on two grounds: (1) observation period is
      mandated per RCUK 2021 for paeds anaphylaxis; (2) Sam weighs
      28 kg — under MHRA/BNFc 2024 he receives **adult EpiPen
      300 mcg** (threshold for the higher-dose pen changed from
      30 kg → 25 kg in 2024). EpiPen Jr is now reserved for
      7.5–25 kg.
    appropriate: false
    epilogue: "Back through paeds resus at 02:14 with biphasic reaction. The system flags your initial discharge decision on the front sheet."
  - label: 'Refer to PICU pre-emptively for invasive ventilation'
    criteria: |
      Premature — Sam is responding to IM adrenaline. PICU only if
      airway compromise develops or refractory shock.
    appropriate: false
    epilogue: "The PICU consultant talks you through the over-escalation politely. 'He didn't need this. We will move him at 06:00.'"
  - label: "Admit AMU under adult medics (sister's under there)"
    criteria: |
      Wrong specialty — he''s a paeds patient. Paeds ward is the
      correct disposition.
    appropriate: false
    epilogue: "The AMU consultant declines the referral within 10 minutes. 'He's eight. Paeds ward, please.' The mum is now in two waiting rooms at once."

state_machine:
  states: [stable, deteriorating, arrested, admitted, discharged]
  transitions:
    - from: deteriorating
      to: stable
      trigger:
        on: action
        action_id: mx_adrenaline_paeds_im
        note: 'Second IM adrenaline + fluids — symptoms continue improving.'
    - from: deteriorating
      to: arrested
      trigger:
        on: inaction_by
        min: 7
        required_actions: [mx_adrenaline_paeds_im, mx_oxygen_paeds]
        note: 'Refractory anaphylaxis to arrest if no second dose and no O2 by T+7.'
    - from: stable
      to: admitted
      trigger: { on: action, action_id: mx_admit_paeds_obs }

pearls:
  - 'Paediatric IM adrenaline dose bands (Resus Council UK 2021): <6 m 100–150 mcg · 6m–6 y 150 mcg · 6–12 y 300 mcg · >12 y 500 mcg.'
  - 'Paeds IV fluid bolus in anaphylaxis is 10 mL/kg — half the old "adult 20 mL/kg" rule. Reassess after every bolus.'
  - 'All paeds anaphylaxis admitted for risk-stratified observation (Resus Council UK 2021). No "1-hour observation and home" shortcut.'
  - 'A shared meal source is a family-wide allergy disclosure event — screen siblings, brief parents, refer to paediatric allergy clinic.'
  - 'A peanut-sensitised child has the same biphasic risk profile as the adult — 6–12 h observation minimum for severe reactions (biphasic incidence ~5% in current meta-analyses; up to 20% in selected severe-reaction cohorts per RCUK 2021).'
  - 'Sam''s timeline (mild lip swelling at 14:30, settled with antihistamine, systemic reaction at 19:30) is a "protracted / delayed-presentation" pattern rather than classic biphasic (which implies a *severe* index reaction with later recurrence). Either way the management is the same — risk-stratified observation per RCUK 2021.'
  - 'Discharge bundle (UK May 2026 per MHRA/BNFc): 2× EpiPen Jr (150 mcg) for **7.5–25 kg**; 2× EpiPen / Jext 300 mcg for **≥25 kg** (the threshold changed from 30 kg to 25 kg in 2024). Sam is 28 kg → receives **2× EpiPen 300 mcg (adult)**, NOT EpiPen Jr. Plus written action plan, paeds allergy referral, school + family briefing.'

pitfalls:
  - 'Adult-dose adrenaline in a child.'
  - 'Anchoring on asthma in a known asthmatic — missing the urticaria, lip swelling, and the shared family trigger.'
  - 'Discharging early without an auto-injector or allergy referral.'
  - 'Giving IV adrenaline bolus to a child who is still responding to IM doses.'
  - 'Forgetting the family-wide implications when one sibling is in resus with the same trigger.'

