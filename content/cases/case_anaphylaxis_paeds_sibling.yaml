# Authored against Resus Council UK 2021 paediatric anaphylaxis algorithm,
# NICE CG134, BTS/SIGN 158 acute asthma sections (chronic management now
# superseded by NICE NG244 Nov 2024) for paeds nebulised doses, APLS principles,
# and Oxford Handbook of EM 5e Ch 15.
#
# Sam Cartwright is Beth's 8y/o brother. While Beth was at her hen-do
# dinner, Sam had a peanut-butter sandwich at lunchtime. His lip got a
# bit swollen and his mum gave him an antihistamine and assumed it was
# nothing. Two hours later the wheeze started. Mum saw on her phone that
# Beth was being treated for severe anaphylaxis to peanut at the
# restaurant; she dialled 999 immediately.

schema_version: 1
id: case_anaphylaxis_paeds_sibling
title: 'Anaphylaxis — child, brother of the resus-bay patient'
chief_complaint: 'Lip swelling and wheeze after peanut butter at lunch'
topic_id: anaphylaxis

vignette: |
  Paeds resus. 21:08.

  Sam, 8 y/o, brought in by his mum Helen. Had peanut butter at a
  friend's birthday party at lunchtime; lip felt "tingly" and a bit
  swollen by 14:30. Mum gave a spoon of cetirizine, swelling settled,
  he was fine until ~19:30 when he started wheezing and looking pale.

  Mum dialled 999 when the wheeze got worse — she knew "this isn't
  right, this isn't like before." She has the cetirizine bottle and
  the leftover sandwich in a Tupperware ("in case you needed to
  see"). She is keeping her voice steady; her hand on his back is not.

  Paramedics: "10-minute drive. IM adrenaline 300 mcg en route — his
  mum had Beth's EpiPen at home and he hadn't been given anything. RR
  was 36, sats 92, lips swollen. He's improved on the way in."

bay: paeds
curriculum_tags: [RP2, AP1, AP2, AC1, RP5, ResC1]
slos: [1, 3, 5]
difficulty_band: ST3
paeds: true

demographics:
  age_value: 8
  age_unit: years
  sex: male
  weight_kg: 28
  pmh:
    - 'Eczema since infancy'
    - 'Mild asthma — salbutamol PRN; has not used it for 6 months'
    - 'Never formally tested for food allergies'
  medications: ['salbutamol 100 mcg inhaler PRN', 'emollients PRN']
  allergies: ['?peanut — newly suspected; sister Beth being treated next door']
  social: |
    Lives with mum Helen, dad Mike, sister Beth. Year 4. No school
    absences. Has previously eaten peanut butter "a few times" without
    a clear reaction — possible historical mild reactions reframed by
    today's events.

triage_category: 2
initial_state: deteriorating
resus_protocol: apls_paeds

