# Authored against BSPED Paediatric DKA Guideline 2021 (last reviewed
# 26 Nov 2024) and APLS 7th edition. Key
# differences from adult JBDS-IP that this case teaches:
#   - 0.9% saline boluses 10 mL/kg over 30 min (NOT 500 mL adult bolus)
#   - Fluid deficit replaced over 48 h (not 24 h) — slower correction
#     reduces cerebral oedema risk
#   - Insulin starts 1 HOUR after fluids commenced (NOT concurrent)
#   - Insulin rate 0.05-0.1 units/kg/h (titrate from 0.05 in <2 y)
#   - Hourly neuro obs for the FIRST 24 hours (cerebral oedema = most
#     feared complication, peaks 4-12 h into treatment)
#
# Amir is an 8 y/o new-onset T1DM. Trap density: 4 must_not_do
# actions including the 20-mL/kg bolus, concurrent insulin, insulin
# bolus, and bicarbonate.

schema_version: 1
id: case_paeds_dka_amir
title: 'Paediatric DKA — first presentation, 8 y/o'
chief_complaint: '?Paediatric DKA · first presentation'
topic_id: paeds_dka

vignette: |
  Paeds resus. 14:32.

  Amir Hassan, 8 y/o, brought in by his mum Yasmin and her partner.
  Triage cat 1. Paramedics' handover: "Mum says he's been drinking
  litres and weeing constantly for three weeks. Vomiting since
  yesterday morning. Got drowsy at school this morning. By lunchtime
  he wasn't really making sense. We were called at 13:50. On scene
  BM 'HI' on the meter, sats 99% air, RR 36 deep and sighing,
  HR 138 sinus, BP 96/58. We gave 10 mL/kg saline en route —
  250 mL of 0.9% sodium chloride, all in. He's been semi-rousable.
  No prior medical history."

  Amir is supine, eyes closed, breathing deeply and rapidly. Mum
  is at the bedside, holding his hand.

curriculum_tags: [EnC2, GC3]
slos: [1, 3, 5]
difficulty_band: ST3
paeds: true

demographics:
  age_value: 8
  age_unit: years
  sex: male
  weight_kg: 26
  pmh: ['no past medical history of note']
  medications: []
  allergies: ['NKDA']
  social: |
    Year 4 at primary school. Lives with mum (Yasmin) and her
    partner Naveed. No prior MH or safeguarding involvement.

triage_category: 1
initial_state: deteriorating
bay: paeds
resus_protocol: apls_paeds

vitals:
  baseline:
    hr: 88
    rr: 20
    spo2: 99
    bp_sys: 102
    bp_dia: 62
    gcs: 15
    temp_c: 36.7
    bm: 5.4
  deteriorating:
    hr: 138
    rr: 36
    spo2: 99
    bp_sys: 96
    bp_dia: 58
    gcs: 12
    temp_c: 36.6
    bm: 36.0
