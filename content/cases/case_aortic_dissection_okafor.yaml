# ─── History ──────────────────────────────────────────────────────────────
history:
  - id: hx_pain_quality
    source: patient
    topic: 'Describe the pain — character, onset, radiation.'
    npc_voice: "Mr Okafor presses his palm flat to his sternum, jaw tight."
    supports: ['Type A aortic dissection extending into RCA, with malperfusion of right upper limb']
    response: |
      "It came on in a second. Between my shoulder blades, like
      somebody'd shoved a knife through me. Then it punched through
      to the front of my chest. Tearing, ripping. It's never been
      like anything else."

  - id: hx_pain_radiation
    source: patient
    topic: 'Has the pain moved or changed?'
    prereq_history_ids: [hx_pain_quality]
    supports: ['Type A aortic dissection extending into RCA, with malperfusion of right upper limb']
    response: |
      "It started in my back. Now it's in my chest and the front of
      my neck on the right. My right arm feels strange too — pins
      and needles. Is that the heart attack?"

  - id: hx_family
    source: patient
    topic: 'Any family history of vascular or aortic problems?'
    supports: ['Type A aortic dissection extending into RCA, with malperfusion of right upper limb']
    response: |
      "My dad died at 64 — they said his aorta had ruptured. I always
      thought it was a heart attack. My sister had her aortic valve
      replaced at 55, bicuspid she said. The doctor told me I had one
      too, a few years ago, but the cardiologist said it was 'fine
      for now.'"

  - id: hx_paramedic
    source: paramedic
    topic: 'Full paramedic handover and the prehospital ECG.'
    response: |
      "We were dispatched at 11:18 for 'chest pain, collapsed at work'.
      On scene 11:24. He was sat on the floor, sweating buckets, GCS
      15 but agitated. ECG looked like an inferior STEMI — ST
      elevation in II, III, aVF, reciprocal change in I and aVL. We
      gave aspirin 300 mg chewed, GTN 800 mcg sublingual twice — no
      response. Pre-alerted cath lab. He's saying it started in his
      back though, not the chest, and the back pain is what brought
      him down."

  - id: hx_anticoag_screen
    source: patient
    topic: 'Are you on any blood thinners or recent procedures?'
    response: |
      "I take aspirin sometimes for headaches but not regularly. No
      warfarin, no apixaban. No recent surgery. No recent procedures.
      I had a tooth out a fortnight ago, no bleeding issues."

  - id: hx_recent_bp
    source: gp_letter
    topic: 'Check the recent BP and clinic letters.'
    prereq_history_ids: [hx_anticoag_screen]
    response: |
      "BP at last GP review (3 months ago): 168/98 untreated white-
      coat-effect cuff, 162/94 ambulatory. Amlodipine titrated to
      10 mg, ramipril to 10 mg. He admitted 'forgetting' doses. Last
      echo (2022): bicuspid aortic valve, mild AR, normal LV
      function, aortic root 4.0 cm at baseline."

  - id: hx_marfanoid_screen
    source: patient
    topic: 'Marfanoid screen — wingspan, joint hypermobility, lens dislocation?'
    prereq_history_ids: [hx_family]
    supports: ['Type A aortic dissection extending into RCA, with malperfusion of right upper limb']
    response: |
      "Tall and thin as a young man, but not unusually so. No lens
      problems I know of. I broke my wrist falling off a bike at 30
      and that healed fine. Sister's bicuspid valve — does that
      count?"

# ─── Examination ──────────────────────────────────────────────────────────
