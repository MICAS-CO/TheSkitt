# Type A aortic dissection masquerading as inferior STEMI — the
# anchor-breaker SAQ. Mr Okafor presents with sudden severe
# interscapular pain that's now in the chest, BP differential between
# arms, a troponin rise, and ST elevation in II/III/aVF. The reflex
# move is the STEMI pathway. The save is recognising tearing pain +
# BP differential + dynamic murmur + the dissection-into-coronary-
# ostium pattern, calculating ADD-RS, and getting CTA before any
# anticoagulation.
#
# Sources: RCEM/RCR Joint Best Practice Guideline 2024 — Diagnosis of Thoracic Aortic Dissection in the ED, ESC
# Guidelines for the Management of Aortic Diseases (2024 update),
# IRAD registry data (Hagan et al., JAMA 2000), Aortic Dissection
# Charitable Trust UK Think Aorta campaign, Oxford Handbook of EM 5e.
# Mortality figure (~1–2% per untreated hour) per TheCase.Report S2E5
# / IRAD.

schema_version: 1
id: case_aortic_dissection_okafor
title: 'Aortic dissection — Type A masquerading as inferior STEMI'
chief_complaint: 'Sudden tearing chest/back pain'
topic_id: aortic_dissection

vignette: |
  Resus bay 2. 11:46.

  Mr Daniel Okafor, 58 y/o, brought in by ambulance after collapsing
  at his desk 25 minutes ago. He describes "the worst pain of my
  life" — started between the shoulder blades, ripped through to the
  front of his chest within seconds. He's diaphoretic, anxious, and
  retching.

  Paramedics: "ECG on the truck shows ST elevation in II, III, aVF.
  Aspirin 300 mg chewed. Sublingual GTN ×2 — no relief. BP 178/104
  right arm; the left cuff kept reading low — they switched arms.
  HR 96 sinus. Sats 96% on air. He's a hypertensive on amlodipine
  and ramipril."

  The cath lab has been pre-alerted. The cardiology SpR is on her way
  down. As you start the primary survey, the patient grabs your wrist
  and says: "It tore. I felt it tear."

curriculum_tags: [CC7, CP1]
slos: [1, 3]
difficulty_band: ST3
paeds: false

demographics:
  age_value: 58
  age_unit: years
  sex: male
  weight_kg: 92
  pmh:
    - 'Hypertension (10 years, poorly controlled)'
    - 'Type 2 diabetes (metformin)'
    - 'Bicuspid aortic valve incidentally noted on echo 4 years ago'
    - 'Ex-smoker (20 pack-year, stopped 6 years ago)'
  medications:
    - 'amlodipine 10 mg OD'
    - 'ramipril 10 mg OD'
    - 'metformin 1 g BD'
    - 'atorvastatin 40 mg ON'
  allergies: ['NKDA']
  social: |
    Project engineer, married, two adult children. Father had a
    "burst aorta" in his 60s — Mr Okafor avoided thinking about it.
    No connective tissue disease documented.

