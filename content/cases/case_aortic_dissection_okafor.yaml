author_notes: |
  Designed as the SAQ-classic anchor-breaker: chest pain + ST
  elevation + troponin rise that turns out to be Type A aortic
  dissection involving the RCA ostium. The save is the tearing
  history + BP differential + pulse deficit + new AR murmur.

  Pairs thematically with case_chest_pain_patel_ambient (STEMI in a
  72-year-old woman who DOES have a STEMI) — the contrast teaches the
  diagnostic-anchor pattern: the differential matters as much as the
  ECG.

  Mortality, CXR sensitivity, and ECG patterns are sourced from the
  IRAD registry (JAMA 2000) and the ESC 2024 aortic diseases
  guideline. ADD-RS sensitivity and combined ADD-RS + D-dimer rule-
  out from Rogers 2011 + Nazerian 2018. RCEM Best Practice 2023 +
  Aortic Dissection Charitable Trust Think Aorta pathway are the UK
  practice references. TheCase.Report S2E5 was the inspiration but
  doesn't appear in player-facing citations.
