      - name: 'Right arm malperfusion pattern'
        value: 'global paraesthesia of the right arm (not strictly dermatomal); cap refill 4 s right hand vs <2 s left; radial pulse reduced — consistent with innominate-artery malperfusion, NOT a single nerve-root lesion'
        present: true
        red_flag: true
