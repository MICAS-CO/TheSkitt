# ─── Investigations ───────────────────────────────────────────────────────
investigations:
  - id: ix_ecg
    name: '12-lead ECG (compare to prehospital strip)'
    category: ecg
    turnaround_min: 2
    essential: true
    result_summary: |
      Sinus rhythm 96/min. **ST elevation 1–2 mm in II, III, aVF**;
      reciprocal depression in I and aVL. Subtle PR depression in
      II. No anterior changes.

      **The trap**: this looks like inferior STEMI. **But** in the
      context of tearing pain and BP differential, the working
      diagnosis is dissection of the ascending aorta extending into
      the RCA ostium — RCA is the proximal coronary in ~30% of
      Type A dissections (IRAD 2007). The inferior changes are a
      consequence, not a primary culprit.
    abnormal: true
    sources:
      - {
          type: textbook,
          ref: 'Hagan PG et al., IRAD: Aortic dissection clinical profiles, JAMA 2000.',
        }
      - {
          type: rcem,
          ref: 'RCEM/RCR Joint Best Practice Guideline 2024 — Diagnosis of Thoracic Aortic Dissection in the ED — ECG patterns mimicking ACS',
        }

  - id: ix_cxr
    name: 'Erect portable chest X-ray'
    category: imaging
    turnaround_min: 8
    result_summary: |
      **Mediastinal widening at the aortic knob; loss of aortic-
      pulmonary window; small left pleural effusion ("apical cap").**
      No pneumothorax. Lung fields clear.

      Caveat: ~20% of aortic dissections have a normal CXR (IRAD
      registry). A normal CXR DOES NOT exclude AD when the pretest
      probability is high — go straight to CTA.
    abnormal: true
    sources:
      - {
          type: rcem,
          ref: 'RCEM/RCR Joint Best Practice Guideline 2024 — Diagnosis of Thoracic Aortic Dissection in the ED — CXR has poor sensitivity (~64%) and normal in ~20%',
        }

  - id: ix_pocus
    name: 'Bedside POCUS — parasternal long and suprasternal view'
    category: bedside
    turnaround_min: 5
    result_summary: |
      Parasternal long-axis: **dilated aortic root (4.8 cm)** with a
      mobile intimal flap visible. Moderate aortic regurgitation jet.
      Small pericardial effusion (~6 mm) — no tamponade physiology
      yet. Suprasternal: intimal flap in proximal arch.

      POCUS is rule-IN, not rule-OUT, for AD. A positive scan
      mandates CTA + cardiothoracics; a negative scan does not
      exclude the diagnosis.
    abnormal: true
    sources:
      - { type: rcem, ref: 'RCEM Learning — POCUS in suspected aortic dissection' }

  - id: ix_cta_aorta
    name: 'CT aorta with contrast (CTA) — gold standard'
    category: imaging
    turnaround_min: 25
    essential: true
    result_summary: |
      **Type A aortic dissection.** Intimal flap from the aortic root
      to just distal to the left subclavian artery (Stanford A,
      DeBakey I). Dissection extends into the proximal RCA — accounts
      for inferior ST elevation. Aortic root 4.9 cm. Small
      haemopericardium without tamponade. False lumen partially
      thrombosed. Innominate artery involved — explains right-arm
      hypoperfusion and paraesthesia.

      **This is a surgical emergency.** Cardiothoracics theatre,
      anaesthetics, and cell salvage on the line.
    abnormal: true
    sources:
      - {
          type: esc,
          ref: 'Mazzolai L et al. 2024 ESC Guidelines for the management of peripheral arterial and aortic diseases. Eur Heart J 2024;45:3538-3700 — CTA as gold standard; introduces TEM classification for acute aortic syndromes.',
        }

  - id: ix_troponin
    name: 'High-sensitivity troponin (hs-cTnI)'
    category: blood
    turnaround_min: 30
    essential: true
    result_summary: |
      **hs-cTnI 184 ng/L (upper reference 14 ng/L for men).** Mildly
      elevated. Consistent with coronary-ostium involvement by the
      dissection flap — NOT primary plaque-rupture MI.

      The audit-classic anchor: a troponin rise in a chest pain
      patient with an ECG pattern that looks ischaemic can lock the
      team into the ACS pathway. Always re-test the dissection
      hypothesis against the history and bedside features (tearing
      pain, BP differential, pulse deficit, new AR murmur).
  - id: ix_bloods
    name: 'FBC, U&E, LFTs, coag, group + crossmatch 4 units, lactate'
    category: blood
    turnaround_min: 45
    result_summary: |
      Hb 138 · Plt 224 · WCC 11.8 · INR 1.0 · APTT 32 · Na 138 ·
      K 4.4 · Urea 6.8 · Creat 102 · Lactate 2.4 (mildly raised) ·
      LFTs normal. **D-dimer 4200 ng/mL** (raised — non-specific but
      adds weight; D-dimer <500 has 95% NPV per RCEM rule-out tools,
      but a positive D-dimer does NOT rule in).
    abnormal: true

  - id: ix_add_rs
    name: 'ADD-RS — Aortic Dissection Detection Risk Score'
    category: bedside
    turnaround_min: 2
    essential: true
    result_summary: |
      **High-risk features ticked**:
      • Predisposing condition: bicuspid aortic valve + family history
        of aortic disease (+1).
      • Pain features: abrupt onset, severe intensity, tearing/ripping
        character (+1).
      • Examination features: BP differential >20 mmHg, pulse deficit
        right radial, new AR murmur, focal neuro right arm (+1).

      **ADD-RS = 3 (high risk).** Urgent CTA + cardiothoracic
      activation. With a positive POCUS and a high ADD-RS the pre-
      test probability of dissection is in the 60–80% range and CTA
      must not be delayed for further bloods.
    abnormal: true
    sources:
      - {
          type: textbook,
          ref: 'Rogers AM et al. Sensitivity of the Aortic Dissection Detection Risk Score (ADD-RS), Circulation 2011.',
        }
      - { type: rcem, ref: 'RCEM Best Practice — ADD-RS for risk stratification' }

# ─── Differential ─────────────────────────────────────────────────────────
differential:
  - diagnosis: 'Type A aortic dissection extending into RCA, with malperfusion of right upper limb'
    likelihood: top
    discriminator: |
      Tearing interscapular → anterior pain + BP differential >20 mmHg
      + pulse deficit + new AR murmur + focal neuro of right arm +
      mediastinal widening on CXR + flap on POCUS = ADD-RS 3.
      Inferior ST elevation is from coronary-ostium involvement, not
      primary thrombotic MI.

  - diagnosis: 'Inferior STEMI (proximal RCA)'
    likelihood: must_not_miss
    discriminator: |
      ECG fits. Troponin fits. BUT: tearing radiating-to-back pain,
      BP differential >86 mmHg, right radial pulse deficit, and a
      new AR murmur are NOT MI features. Treating as STEMI (heparin,
      ticagrelor, tenecteplase if no PCI available) would be lethal
      if AD is missed — anticoagulation expands the haematoma.

  - diagnosis: 'Pulmonary embolism (massive)'
    likelihood: worth_considering
    discriminator: |
      Sudden severe chest pain + dyspnoea — but the pain is anterior
      not pleuritic, BP differential and pulse deficit are NOT PE
      features, and the ECG is regional ST elevation not the S1Q3T3
      / RV strain pattern.

  - diagnosis: 'Oesophageal rupture (Boerhaave syndrome)'
    likelihood: worth_considering
    discriminator: |
      Severe chest pain after retching — Mr Okafor has been retching,
      but tearing pre-vomiting onset + BP differential + pulse
      deficit point to dissection. CXR would show mediastinal air or
      pneumothorax in Boerhaave; here it shows mediastinal widening.

  - diagnosis: 'Cardiac tamponade from primary pericarditis'
    likelihood: unlikely
    discriminator: |
      POCUS shows pericardial effusion BUT no tamponade physiology
      (no RV diastolic collapse, no pulsus). Effusion in this
      context is the secondary consequence of haemopericardium from
      AD, not the primary diagnosis.

# ─── Management ──────────────────────────────────────────────────────────
working_diagnosis: |
  Type A acute aortic dissection (Stanford A, DeBakey I) with proximal
  RCA involvement causing inferior ST elevation, innominate
  involvement causing right-arm malperfusion, small haemopericardium,
  and moderate AR. Surgical emergency — cardiothoracics, anaesthetics,
  cell salvage, group + crossmatch 4 units.

management:
  - id: mx_a_to_e_monitoring
    category: monitoring
    resus_letter: A
    name: 'ABCDE; large-bore IV ×2 above the diaphragm; full monitoring; arterial line in the right arm'
    detail: |
      Avoid lines through the femoral if iliac dissection extension
      is possible. The right arm is the high-pressure side here, so
      an art line there gives the truest reading. Cell salvage and
      crossmatch 4 units in parallel.
    must_do: true
    sources:
      - { type: rcem, ref: 'RCEM Best Practice — Aortic Dissection initial assessment' }

  - id: mx_iv_labetalol
    category: drug
    resus_letter: C
    name: 'IV labetalol bolus + infusion — target HR <60, systolic <120 mmHg'
    detail: |
      Combined alpha/beta blockade lowers shear stress (dP/dt) on the
      flap. Bolus 10–20 mg IV (≈0.1–0.2 mg/kg in an adult), repeat
      every 10 min as tolerated to a max ~200 mg cumulative bolus
      (BNF cap; harmonised with hypertensive-emergency dosing in
      Oduya case), then infusion 0.5–2 mg/min titrated to HR + BP.
      Heart-rate control is as important as BP control — lowering BP
      without slowing HR can paradoxically raise dP/dt. ESC 2024
      target: **HR <60** in acute Type A.
    must_do: true
    drug:
      amount: '10–20 mg IV bolus (max ~200 mg cumulative); infusion 0.5–2 mg/min'
      route: IV
      frequency: 'titrate to HR <60 and systolic <120 mmHg'
    sources:
      - { type: esc, ref: 'ESC Aortic Diseases Guideline 2024 — BP and HR targets in acute AD' }
      - { type: rcem, ref: 'RCEM Best Practice — Aortic Dissection 2023' }

  - id: mx_gtn_after_beta
    category: drug
    resus_letter: C
    prereq_action_ids: [mx_iv_labetalol]
    name: 'IV GTN AFTER beta-blockade (never before)'
    detail: |
      Vasodilator before beta-blocker → reflex tachycardia → ↑dP/dt
      → propagation of the dissection. ALWAYS achieve rate control
      before adding GTN. GTN 2–10 mg/h infusion to fine-tune the
      systolic.
    drug:
      amount: '2–10 mg/h IV infusion'
      route: IV
      frequency: 'titrate to systolic <120 mmHg, AFTER beta-blockade established'
    sources:
      - { type: esc, ref: 'ESC Aortic Diseases Guideline 2024 — sequencing of BP agents' }

  - id: mx_analgesia
    category: drug
    resus_letter: D
    name: 'IV morphine titrated (1–2 mg, repeat after 5 min) + antiemetic'
    detail: |
      Adequate analgesia lowers sympathetic drive, which lowers dP/dt
      and indirectly slows propagation. Pair with an antiemetic
      (ondansetron 4 mg IV).
    must_do: true
    drug:
      amount: 'Morphine 1–2 mg IV, repeat every 5 min to effect (max ~10 mg in this period); ondansetron 4 mg IV.'
      route: IV
      frequency: 'titrate to pain ≤4/10'

  - id: mx_cardiothoracics_call
    category: referral
    name: 'Cardiothoracic surgery activation + retrieval if local hospital not a surgical centre'
    detail: |
      Type A is a surgical emergency — open repair (Bentall procedure
      / arch replacement) within hours. Coordinate with anaesthetics,
      transfusion (cell salvage), ITU bed. If you are not in a
      surgical centre, blue-light retrieval transfer.
    must_do: true
    sources:
      - {
          type: esc,
          ref: 'ESC 2024 — Type A AD: immediate surgical referral, mortality ~50% in first 48 h if untreated',
        }
      - { type: textbook, ref: 'Aortic Dissection Charitable Trust — Think Aorta UK pathway' }

  - id: mx_anaesthetics_call
    category: referral
    name: 'Anaesthetics for theatre preparation + airway plan'
    detail: |
      Patient may need RSI in ED if deteriorating. Pre-induction
      labetalol is critical — avoid catecholamine surge that
      propagates dissection. Have crossmatched blood at the bedside.
    must_do: true

  - id: mx_crossmatch_blood
    category: procedure
    resus_letter: C
    name: 'Crossmatch 4–6 units; activate cell salvage; notify haematology'
    detail: 'Bentall + arch repair often need 6–10 units. Notify the blood bank early.'
    must_do: true

  - id: mx_pain_documentation
    category: communication
    name: 'Document time of onset; family communication; consent for emergency surgery'
    detail: |
      Time of pain onset is the start of the survival clock. Family
      need to be at the bedside before he goes to theatre — Type A
      operative mortality is ~25%, untreated mortality is ~50% at
      48 h.
    must_do: true
    sources:
      - {
          type: textbook,
          ref: 'IRAD registry: Type A AD untreated mortality ~1–2% per hour in first 48 h.',
        }

  # ─── Examiner traps ──────────────────────────────────────────────────
  - id: mx_no_aspirin_more
    category: drug
    name: 'Continue/repeat aspirin 300 mg; load with ticagrelor 180 mg per STEMI pathway'
    detail: |
      ❌ The paramedics gave aspirin 300 mg before the dissection was
      suspected — that horse has bolted, but DO NOT escalate to dual
      antiplatelet or anticoagulation. Antiplatelets/anticoagulants
      expand the false lumen and worsen pericardial bleeding.
    must_not_do: true
    gated_by_history: [hx_paramedic]
    sources:
      - {
          type: rcem,
          ref: 'RCEM Best Practice — antiplatelets/anticoagulants are CONTRAINDICATED in suspected AD',
        }

  - id: mx_no_heparin
    category: drug
    name: 'IV unfractionated heparin (per STEMI pathway)'
    detail: |
      ❌ Heparin expands the haematoma and can convert a contained
      dissection into a free rupture. Stop the ACS pathway the moment
      dissection becomes a serious differential — BEFORE the ECG
      argument is "settled".
    must_not_do: true

  - id: mx_no_pci
    category: procedure
    name: 'Primary PCI activation for inferior STEMI'
    detail: |
      ❌ Catheterising a dissected aortic root can extend the
      dissection or create a new entry tear. The cath lab is the
      wrong room. CTA + cardiothoracic surgical theatre is the
      pathway.
    must_not_do: true

  - id: mx_no_gtn_alone
    category: drug
    name: 'IV GTN infusion as the first BP agent (without beta-blocker)'
    detail: |
      ❌ Vasodilator before rate control = reflex tachycardia =
      higher dP/dt = dissection propagation. Beta-blocker first,
      vasodilator second.
    must_not_do: true

  - id: mx_no_lp_for_neuro
    category: procedure
    name: 'Lumbar puncture for the right-arm paraesthesia (work up stroke / SAH)'
    detail: |
      ❌ The neuro signs are from innominate-artery malperfusion, not
      cerebral pathology. LP delays the surgical decision and risks
      anticoagulation-related complications.
    must_not_do: true

  - id: mx_no_femoral_line
    category: procedure
    name: 'Femoral central line for access'
    detail: |
      ❌ If iliac extension is present, femoral access can disturb
      the dissection or measure a falsely low pressure. Use upper-
      limb access on the high-reading side (right arm here).
    must_not_do: true

# ─── Disposition ─────────────────────────────────────────────────────────
disposition_options:
  - label: 'Direct transfer to cardiothoracic theatre under anaesthetic team; group-crossmatched blood at bedside'
    criteria: |
      Type A AD with malperfusion + haemopericardium = immediate
      surgical repair. The ED stabilisation window is minutes, not
      hours — every hour of delay is ~1–2% extra mortality.
    appropriate: true
  - label: 'Admit CCU on a labetalol infusion; cardiothoracics review in the morning'
    criteria: |
      Inadequate — Type A AD does not wait until morning. CCU is the
      pathway for medical management of Type B AD, not Type A.
    appropriate: false
  - label: 'Primary PCI activation per inferior STEMI pathway'
    criteria: |
      Lethal — anticoagulating and cannulating a dissected aorta
      propagates the bleed. The inferior ECG changes are a
      consequence of coronary-ostium involvement; the primary
      diagnosis is the dissection.
    appropriate: false

# ─── State machine ──────────────────────────────────────────────────────
state_machine:
  states: [deteriorating, stable, arrested, admitted]
  transitions:
    - from: deteriorating
      to: stable
      trigger:
        on: action
        action_id: mx_iv_labetalol
        note: 'Beta-blockade brings HR + BP toward target; pain settles; dissection propagation slowed pending surgery.'
    - from: deteriorating
      to: arrested
      trigger:
        on: inaction_by
        min: 20
        required_actions: [mx_iv_labetalol, mx_cardiothoracics_call]
        note: 'Without BP/HR control and surgical activation by T+20 the dissection extends, the haemopericardium worsens, and the patient tamponades / free-ruptures.'
    - from: stable
      to: admitted
      trigger:
        on: action
        action_id: mx_anaesthetics_call
        note: 'Anaesthetic team takes the airway and transfers to theatre — ED responsibility ends.'

# ─── Pearls + pitfalls ──────────────────────────────────────────────────
pearls:
  - 'IRAD/TheCase.Report S2E5: AD mortality rises ~1–2% per untreated hour. ~20% have a normal CXR. ~6% are painless. The clinical features (BP differential, pulse deficit, AR murmur, focal neuro) carry more weight than imaging alone in deciding pretest probability.'
  - 'ADD-RS ≥1 with classic features should trigger urgent CTA. ADD-RS 0 + D-dimer <500 ng/mL gives a high NPV for safely ruling out (per ADvISED study).'
  - 'Type A (Stanford A / DeBakey I or II) = ascending aorta involved = surgical emergency. Type B (Stanford B / DeBakey III) = descending only = medical management in most cases.'
  - 'BP and HR control: target systolic <120 mmHg AND HR 60–80. Beta-blocker BEFORE vasodilator — reflex tachycardia propagates the dissection.'
  - 'Coronary-ostium dissection (RCA in ~30% of Type A) mimics inferior STEMI. Tearing pain + BP differential + pulse deficit + new AR murmur ALL outweigh the ECG. Anchoring on STEMI kills.'
  - 'Antiplatelets and anticoagulants are CONTRAINDICATED in suspected AD. If aspirin was given before suspicion was raised, do not escalate.'
  - 'Cell salvage + 4–6 unit crossmatch in parallel with the surgical call — the operative blood requirement is substantial.'

pitfalls:
  - 'Anchoring on the STEMI ECG and missing the tearing pain + BP differential.'
  - 'Giving heparin / ticagrelor / alteplase in suspected AD.'
  - 'Reading the CXR as "no widening" and excluding AD on that basis (~20% normal in confirmed AD).'
  - 'Vasodilator before beta-blockade — reflex tachycardia, dissection propagation.'
  - 'Femoral access (line or art line) in a patient with potential iliac extension.'
  - "Anchoring on AD when it isn't — the must-not-miss alternative is genuinely an MI; pretest probability and ADD-RS guide the call."

