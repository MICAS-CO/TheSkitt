# MILESTONE 8 — ambient board-pressure case.
#
# Stan is a 58y/o frequent flyer brought in by paramedics, smelling of
# alcohol, GCS 13. The temptation is to assume "the usual" and leave him
# in a side room. The actual diagnoses: hypoglycaemia (BM 2.4) AND a small
# forehead laceration with periorbital bruising from a fall — NICE NG232
# CT-head territory if anticoagulated or any of the indications.
#
# Sources: NICE NG232 (head injury), TREND-UK hypoglycaemia, RCEM Best
# Practice — Alcohol Withdrawal, Oxford Handbook of EM 5e Ch 14.

schema_version: 1
id: case_intox_stan_ambient
title: 'Frequent flyer intoxicated — minors'
chief_complaint: '"Drunk again, the usual" — paramedics'
topic_id: alcohol_withdrawal

vignette: |
  Side room in minors. 19:18.

  Stan Williams, 58 y/o, brought in by paramedics from outside a city-
  centre pub. Smells strongly of alcohol. GCS 13 — opens eyes to voice,
  confused speech, obeys commands. Paramedics: "Stan again. Found him
  on the pavement. Said he'd had a few. Said his head hurt but you
  know what he's like." A small graze sits above his left eyebrow.

curriculum_tags: [GC1, MHC1, NeuP1, TP1]
slos: [1, 7]
difficulty_band: ST3
paeds: false

demographics:
  age_value: 58
  age_unit: years
  sex: male
  weight_kg: 78
  pmh: ['alcohol-use disorder', 'previous head injury 2023', 'no formal diagnosis of dementia']
  medications: ['no regular prescribed meds documented']
  allergies: ['NKDA']
  social: |
    Rough-sleeping. Frequent ED attendances for intoxication. No
    next-of-kin documented. Triage nurse recognises him.

triage_category: 3
initial_state: stable

history:
  - id: hx_paramedics
    source: paramedic
    topic: 'Anything on the way in?'
    response: |
      "Found seated on the pavement outside the Crown. Eye-witness said
      he stood up, took two steps, and went down. Hit his head on the
      kerb. He couldn't remember after — but he never can. No seizure
      seen. Sats 96% room air, BM not checked."

  - id: hx_history
    source: records
    topic: 'Pull the records.'
    response: |
      "Last attendance 9 days ago: intoxication, discharged. 3 months
      ago: blood test showed normal LFTs. No anticoagulant or DOAC
      prescribed."

  - id: hx_stan_speech
    source: patient
    topic: 'Ask Stan directly.'
    response: |
      "Hello. Yeah. Just had a couple. No, three. My… my head hurts.
      Sleepy. Don't take me to the ward, I just need to sleep it off."
      (Mumbling, dropping off mid-sentence.)

  - id: hx_fall_mechanism
    source: paramedic
    topic: 'Was the fall witnessed?'
    response: |
      "Yes — eye-witness says he just dropped. No warning. No fitting.
      Could've been a syncope, could've been the drink. We weren't
      there for the fall itself."

examination:
  - system: general
    findings:
      - { name: 'GCS', value: '13 (E3 V4 M6)' }
      - { name: 'smells of alcohol', present: true }
      - { name: 'thin, unkempt', present: true }
  - system: airway
    findings:
      - { name: 'patent, swallowing own secretions', present: true }
  - system: breathing
    findings:
      - { name: 'RR', value: '14/min' }
      - { name: 'SpO2', value: '96% on air' }
  - system: circulation
    findings:
      - { name: 'HR', value: '78/min, sinus' }
      - { name: 'BP', value: '128/76 mmHg' }
      - { name: 'capillary refill', value: '<2 s' }
  - system: disability
    findings:
      - { name: 'pupils', value: 'equal and reactive' }
      - { name: 'glucose', value: 'NOT YET CHECKED — paramedics did not document a BM' }
      - { name: 'lateralising signs', present: false, pertinent_negative: true }
  - system: exposure
    findings:
      - { name: 'forehead laceration', value: '~2 cm, left eyebrow, mild oozing' }
      - { name: 'left periorbital bruising', present: true }
      - { name: 'temperature', value: '36.4°C' }

investigations:
  - id: ix_bm
    name: 'Capillary blood glucose (BM)'
    category: bedside
    turnaround_min: 1
    result_summary: |
      **2.4 mmol/L** — hypoglycaemia. (TREND-UK threshold for "severe"
      hypoglycaemia is <3.0 mmol/L; treat immediately.)
    abnormal: true
    sources:
      - { type: trend_uk, ref: 'TREND-UK hypoglycaemia guidance — threshold and treatment' }

  - id: ix_vbg
    name: 'Venous blood gas + lactate + ethanol'
    category: gas
    turnaround_min: 5
    result_summary: |
      pH 7.36 · lactate 2.0 · ethanol 215 mg/dL (significantly elevated)
      · K+ 3.5 · Na 138. No acidosis or AKI.
    abnormal: true

  - id: ix_ct_head
    name: 'CT head'
    category: imaging
    turnaround_min: 35
    result_summary: |
      No intracranial haemorrhage, no skull fracture. Periorbital soft
      tissue swelling correlates with the laceration. (Indication per
      NICE NG232: GCS <13 within 1 h of injury → CT within 1 h.)
    sources:
      - {
          type: nice,
          id: 'NG232',
          ref: 'NICE NG232 head injury, CT indications — GCS <13 within 1 h',
        }

  - id: ix_ecg
    name: '12-lead ECG'
    category: ecg
    turnaround_min: 2
    result_summary: 'Sinus rhythm 78/min. No ischaemic change. QTc 420 ms.'

differential:
  - diagnosis: 'Hypoglycaemia (BM 2.4) on a background of intoxication'
    likelihood: top
    discriminator: 'BM result alone is diagnostic; explains drop in conscious level beyond what alcohol alone would predict.'
  - diagnosis: 'Acute intracranial haemorrhage from witnessed fall'
    likelihood: must_not_miss
    discriminator: 'Periorbital bruising + witnessed fall + GCS 13 → NICE NG232 CT head required.'
  - diagnosis: 'Wernicke encephalopathy'
    likelihood: worth_considering
    discriminator: 'Chronic alcohol misuse + confusion → give IV Pabrinex; gait and eye signs would help (cannot test reliably here).'
  - diagnosis: 'Pure alcohol intoxication'
    likelihood: unlikely
    discriminator: 'Convenient but excludes the BM 2.4 and the head injury indication. Anchoring trap.'

working_diagnosis: 'Hypoglycaemia + head injury requiring CT, on a background of acute alcohol intoxication'

management:
  - id: mx_check_bm
    category: monitoring
    name: 'Check capillary blood glucose'
    detail: |
      Anyone with a reduced level of consciousness gets a BM — it is the
      cheapest, fastest investigation in the department.
    must_do: true
    sources:
      - { type: rcem, ref: 'RCEM Best Practice — confused patient in the ED' }

  - id: mx_iv_dextrose
    category: drug
    name: 'IV 10% dextrose 200 mL stat'
    detail: |
      Severe hypoglycaemia in adults: 100 mL of 20% glucose (or 200 mL of
      10%) IV over 10–15 min, then recheck. Avoid 50% glucose (vein
      damage).
    must_do: true
    drug:
      amount: '200 mL of 10% dextrose'
      route: IV
      frequency: 'stat; recheck BM at 10 min'
    sources:
      - { type: trend_uk, ref: 'TREND-UK hypoglycaemia — severe adult treatment' }

  - id: mx_pabrinex
    category: drug
    name: 'IV Pabrinex (high-potency vitamins B&C) for Wernicke prevention'
    detail: |
      Before any carbohydrate load if at all possible; otherwise
      concurrently. Pabrinex 1 pair IV TDS for 3 days in this population.
    must_do: true
    drug:
      amount: 'Pabrinex 1 pair IV'
      route: IV
      frequency: 'TDS for 3 days'
    sources:
      - { type: nice, id: 'CG100', ref: 'NICE CG100 — alcohol-use disorders, Pabrinex' }

  - id: mx_ct_head
    category: monitoring
    name: 'Request urgent CT head'
    detail: 'NICE NG232 indication — GCS <13 within 1 h of injury.'
    must_do: true

  - id: mx_position_observe
    category: monitoring
    name: 'Recovery position; continuous NEWS2; reassess in 10 min'
    must_do: true

  - id: mx_no_assume_alcohol
    category: observation
    name: 'Leave Stan in the side room to "sleep it off"'
    detail: |
      ❌ Anchoring trap. NICE NG232 explicitly warns against assuming
      reduced consciousness in an intoxicated patient is due to alcohol
      alone. BM and CT head are both indicated here.
    must_not_do: true
    sources:
      - { type: nice, id: 'NG232', ref: 'NICE NG232 — do not assume alcohol explains reduced GCS' }

  - id: mx_no_oral_glucose
    category: drug
    name: 'Give oral glucose gel'
    detail: |
      ❌ Wrong route. GCS 13 with confused speech — aspiration risk; IV
      route is required for severe adult hypoglycaemia per TREND-UK.
    must_not_do: true

disposition_options:
  - label: 'Admit to acute medical unit with hourly BMs and observation'
    criteria: 'Appropriate — BM correction needs follow-on monitoring; head injury workup may dictate admission.'
    appropriate: true
  - label: 'Discharge to safer-sleeping team once CT is clear and BM stable'
    criteria: 'Possible if all reassuring after observation; coordinate with safer-sleeping outreach.'
    appropriate: true
  - label: 'Discharge home now, advise to come back if worse'
    criteria: 'Inappropriate — confused, intoxicated, head injured, no fixed address.'
    appropriate: false

state_machine:
  states: [stable, deteriorating, arrested, admitted, discharged]
  transitions:
    - from: stable
      to: deteriorating
      trigger:
        on: inaction_by
        min: 10
        required_actions: [mx_check_bm]
        note: |
          Hypoglycaemia worsens — drowsy, becoming unresponsive. NEWS2
          rises. Needs immediate IV dextrose.
    - from: deteriorating
      to: stable
      trigger: { on: action, action_id: mx_iv_dextrose, note: 'BM corrects post-dextrose.' }
    - from: deteriorating
      to: arrested
      trigger:
        on: inaction_by
        min: 15
        required_actions: [mx_iv_dextrose]
        note: 'Severe hypoglycaemic seizure → arrest if untreated.'

pearls:
  - 'Reduced GCS in an intoxicated patient is not "just the drink" — check a BM and consider CT head per NICE NG232.'
  - 'Severe hypoglycaemia in an adult: 100 mL 20% glucose (or 200 mL 10%) IV; avoid 50%.'
  - 'Give Pabrinex before glucose if at all feasible, to reduce Wernicke risk in chronic alcohol misuse.'
  - 'A frequent flyer is the highest-risk patient on the board — alarm fatigue is the trap.'

pitfalls:
  - 'Anchoring on alcohol and skipping the BM.'
  - 'Oral glucose in a confused patient (aspiration risk).'
  - 'Missing the head injury indication for CT (NICE NG232).'
  - 'Leaving the patient in a side room without continuous monitoring.'

sources:
  - {
      type: nice,
      id: 'NG232',
      ref: 'Head injury: assessment and early management (NICE 2023)',
      url: 'https://www.nice.org.uk/guidance/ng232',
    }
  - {
      type: nice,
      id: 'CG100',
      ref: 'Alcohol-use disorders: physical complications (NICE 2010, updated)',
    }
  - { type: trend_uk, ref: 'TREND-UK — Management of Hypoglycaemia in Adults with Diabetes' }
  - { type: rcem, ref: 'RCEM Best Practice — Confused / Intoxicated Patient in the ED' }
  - {
      type: textbook,
      ref: 'Wyatt JP et al. Oxford Handbook of Emergency Medicine 5e (OUP, 2020).',
      chapter: '14',
      page: 'pp.620–625',
    }

author_notes: |
  Ambient case for the hen-do shift. The mechanic is "frequent flyer
  alarm fatigue" — the player must check a BM and request CT head
  rather than assume alcohol. Stan deteriorates at T+10 from shift
  start if BM not checked; arrests at T+15 if dextrose not given.
