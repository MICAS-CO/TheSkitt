# SAMPLE CASE — ambient board-pressure case.
# Demonstrates a Tier-3 minors case that lives on the board for texture
# and can be escalated to a focus case if neglected (build-prompt
# Milestone 8 stretch goal).

schema_version: 1
id: case_minor_laceration_ambient
title: 'Minors — forearm laceration, glass'
chief_complaint: 'Hand cut on glass'
topic_id: trauma_minor
vignette: |
  42M, walked in. Cut left forearm on a glass after slipping. Brisk
  bleed initially, now pressure-controlled.
  # TODO: schema exercise only — clinical content not authored.

curriculum_tags: [TP10, TP7]
slos: [4]
difficulty_band: CT1
paeds: false

demographics:
  age_value: 42
  age_unit: years
  sex: male
  weight_kg: 80

triage_category: 4
initial_state: stable
bay: minors

differential:
  - diagnosis: Uncomplicated laceration
    likelihood: top
    discriminator: 'Examine for tendon/nerve/vessel injury and FB.'

working_diagnosis: 'Forearm laceration — examine neurovascular and tendon function'

management:
  - id: mx_examine_nv
    category: procedure
    name: 'Neurovascular and tendon exam'
    must_do: true
  - id: mx_clean_close
    category: procedure
    name: 'Clean, explore, close'
  - id: mx_safety_net
    category: safety_net
    name: 'Safety-net advice on signs of infection'

disposition_options:
  - label: 'Discharge from minors with safety-net'
    criteria: 'Neurovascular intact, no tendon injury, no FB.'
    appropriate: true

state_machine:
  states: [stable, discharged]
  transitions:
    - from: stable
      to: discharged
      trigger: { on: action, action_id: mx_clean_close }

sources:
  - { type: textbook, ref: 'Oxford Handbook of EM 5e, Ch 9 Wounds and fractures', chapter: '9' }
