# ─── Investigations ───────────────────────────────────────────────────────
investigations:
  - id: ix_ct_head
    name: 'CT head (non-contrast) — within 8 h per NICE NG232'
    category: imaging
    turnaround_min: 30
    result_summary: |
      **Small acute right frontal subdural haematoma** — 5 mm thick,
      no midline shift, no mass effect. Coup-contrecoup pattern with
      a tiny contusion at the left occipital pole. No skull fracture.
      Ventricles normal-sized.

      Findings: surgical opinion required for SDH-on-anticoagulant
      decision; reversal considered (NICE NG232: discuss with
      haematology + neurosurgery).
    abnormal: true
    sources:
      - {
          type: nice,
          id: 'NG232',
          ref: 'NICE NG232 — CT head within 8 hours in any adult on anticoagulant after head injury, even if otherwise asymptomatic',
        }

  - id: ix_ct_cspine
    name: 'CT cervical spine (after head)'
    category: imaging
    turnaround_min: 35
    result_summary: |
      **No fracture. Mild degenerative change C4-C6 (her age).**
      Cleared for collar removal once awake patient confirms no
      midline tenderness on re-examination. Canadian C-spine rule
      mandates imaging here: age ≥65 + dangerous mechanism (fall
      ≥1 m / stairs) — meets criterion even with low risk features.
    sources:
      - {
          type: textbook,
          ref: 'Canadian C-spine Rule (Stiell 2001) — high-risk: age ≥65; dangerous mechanism; paraesthesia.',
        }
      - { type: nice, id: 'NG232', ref: 'NICE NG232 — adjunctive C-spine imaging in head injury' }

  - id: ix_bloods
    name: 'FBC, U&E, LFTs, coag, INR if on warfarin, group + save'
    category: blood
    turnaround_min: 45
    result_summary: |
      WCC 8.4 · Hb 132 · Plt 224 · Na 138 · K 4.2 · Urea 7.1 ·
      Creat 92 (eGFR 58 — same as 6 weeks ago) · LFTs normal ·
      **APTT 42 / PT 12 — apixaban is FXa inhibitor; INR / PT /
      APTT do NOT reliably measure apixaban effect.** Anti-Xa
      activity (anti-Xa apixaban-calibrated) sent — turnaround
      30–60 min depending on lab.
    abnormal: true
    sources:
      - {
          type: textbook,
          ref: 'British Society for Haematology — Reversal of DOACs (2024): anti-Xa for apixaban / rivaroxaban; dTT for dabigatran.',
        }

  - id: ix_anti_xa
    name: 'Apixaban-calibrated anti-Xa activity'
    category: blood
    turnaround_min: 45
    result_summary: |
      **Apixaban-calibrated anti-Xa 184 ng/mL** (therapeutic peak
      range ~100–200 ng/mL — within expected window 6.5 h post-dose).
      Confirms therapeutic anticoagulation; reversal is on the table
      if neurosurgery deem ongoing bleed risk.

  - id: ix_ecg
    name: '12-lead ECG'
    category: ecg
    turnaround_min: 5
    result_summary: |
      Sinus rhythm 88 bpm. No acute ischaemic change. QTc 410 ms.
      No prolonged PR.

  - id: ix_lying_standing_bp
    name: 'Lying/standing BP'
    category: bedside
    turnaround_min: 5
    result_summary: |
      Lying 148/82 · Standing (3 min) 122/72 — drop of 26/10.
      Postural hypotension contributing to falls risk; ramipril
      titration overdue. Inpatient falls bundle to include MDT
      OT review now that imaging is sorted.

# ─── Differential ─────────────────────────────────────────────────────────
differential:
  - diagnosis: 'Mild traumatic brain injury with traumatic subdural haematoma on anticoagulation'
    likelihood: top
    discriminator: |
      Mechanism (low-impact fall with anti-coagulation) + GCS 15 with
      a positive CT head. NICE NG232 mandates CT within 8 h regardless
      of clinical findings in anyone on anticoagulant after a head
      injury.

  - diagnosis: 'Subarachnoid haemorrhage'
    likelihood: worth_considering
    discriminator: |
      Coup-contrecoup pattern with a tiny occipital contusion is more
      typical of traumatic SDH. SAH would more often produce thunderclap
      headache, signs of meningism, or a Hunt-Hess severity grade. CT
      rules in SDH not SAH.

  - diagnosis: 'Mechanical fall — no intracranial injury (best case)'
    likelihood: must_not_miss
    discriminator: |
      Would have been the working diagnosis pre-CT. The DOAC mandate
      is exactly this trap: she looks well, she wants to go home,
      and she would have an unrecognised SDH that progresses
      overnight without scan.

  - diagnosis: 'Cervical spine injury'
    likelihood: worth_considering
    discriminator: |
      Canadian C-spine high-risk (age ≥65 + ≥1 m fall) — CT C-spine
      mandated. CT excludes fracture; collar can come off if no
      midline tenderness on re-assessment.

# ─── Management ──────────────────────────────────────────────────────────
working_diagnosis: |
  Anticoagulant-associated traumatic subdural haematoma. Decision tree:
  reverse apixaban (4-factor PCC 25-50 IU/kg per BSH 2024 — andexanet
  alfa is NOT NICE-recommended for intracranial haemorrhage since
  TA1029 terminated the appraisal in Jan 2025; ANNEXa-I (NEJM 2024)
  showed haemostatic benefit but no mortality/disability benefit),
  admit for neuro obs, neurosurgical opinion. Re-evaluate apixaban
  resumption on day 2-3 in MDT setting (stroke risk vs bleed risk).

management:
  - id: mx_a_to_e_and_collar
    category: monitoring
    name: 'A-G assessment + cervical collar in situ until C-spine cleared'
    must_do: true
    sources:
      - { type: nice, id: 'NG232', ref: 'NICE NG232 — initial assessment + C-spine immobilisation' }

  - id: mx_ct_head_within_8h
    category: monitoring
    name: 'CT head within 8 h (DOAC mandate)'
    detail: |
      NICE NG232 (§1.5.13, 2023) says **consider** CT within 8 hours
      in any adult on anticoagulant therapy after head injury — a
      softening from the prior CG176 "must" mandate. In a recurrent
      faller, age 78, lives alone, with a forehead haematoma, the
      clinical judgement here is unambiguously to scan; the
      guideline framing is "should consider", not absolute. Document
      the reasoning either way.
    must_do: true
    sources:
      - {
          type: nice,
          id: 'NG232',
          ref: 'NICE NG232 §1.5.13 — consider CT within 8 h in adults on anticoagulant after head injury (softened from CG176 mandate)',
        }

  - id: mx_ct_cspine
    category: monitoring
    name: 'CT C-spine (Canadian C-spine high-risk)'
    detail: |
      Age ≥65 OR dangerous mechanism OR paraesthesia → imaging
      mandated. She is 78 — meets criterion. Use the same CT pass.
    must_do: true
    sources:
      - { type: nice, id: 'NG232', ref: 'NICE NG232 — C-spine imaging adjunct' }

  - id: mx_neuro_obs
    category: monitoring
    name: 'Neuro observations — half-hourly initially'
    detail: |
      NICE NG232: half-hourly observations until GCS 15 sustained for
      2 h, then hourly for 4 h, then 2-hourly. Earlier deterioration
      → immediate senior review + repeat imaging.
    must_do: true
    sources:
      - { type: nice, id: 'NG232', ref: 'NICE NG232 — neuro observations after head injury' }

  - id: mx_apixaban_hold
    category: drug
    name: 'Hold apixaban; document last dose time and indication'
    detail: |
      Apixaban must be paused. Document last dose (07:30 today),
      indication (CHA2DS2-VASc 4 PAF), and stroke risk. The
      resumption decision is for the MDT, not today's ED.
    must_do: true

  - id: mx_haem_neurosurg_discuss
    category: referral
    name: 'Discuss with haematology + neurosurgery — reversal vs observation'
    detail: |
      DOAC reversal decision: **4-factor PCC 25–50 IU/kg** is the
      UK standard for ICH on apixaban/rivaroxaban per BSH 2024.
      Andexanet alfa is **NOT NICE-recommended for ICH** as of
      January 2025 (TA1029 terminated the appraisal — ANNEXa-I
      NEJM 2024 showed haemostatic benefit but no mortality /
      disability benefit; manufacturer declined to submit further
      evidence). For GI bleeding the original TA697 recommendation
      still applies in some pathways. Discussion balances bleed
      extent, neurosurgical view, and reversal-related thrombotic
      risk.
    must_do: true
    sources:
      - {
          type: textbook,
          ref: 'British Society for Haematology — Guidance for use of factor concentrates in DOAC-associated bleeding (2024): 4-factor PCC 25-50 IU/kg first-line for ICH.',
        }
      - {
          type: textbook,
          ref: 'Connolly SJ et al. ANNEXa-I — andexanet for anticoagulant-associated ICH. NEJM 2024 (haemostasis improved but no mortality/disability benefit; led to TA1029 termination Jan 2025).',
        }
      - {
          type: nice,
          id: 'TA697',
          ref: 'NICE TA697 — Andexanet alfa (remains active for GI bleed; ICH indication superseded by TA1029 termination Jan 2025).',
        }

  - id: mx_admission_observe
    category: disposition
    name: 'Admit for neuro observation regardless of CT result'
    detail: |
      Even with a negative scan, NICE NG232 advises admission for
      observation in anticoagulated patients after head injury.
      With a positive SDH, this is mandatory.
    must_do: true
    sources:
      - { type: nice, id: 'NG232', ref: 'NICE NG232 — admission criteria' }

  - id: mx_safety_net_only
    category: safety_net
    name: 'Discharge with head injury advice leaflet only'
    detail: |
      ❌ Anticoagulant + abnormal CT + age 78 + lives alone =
      cannot be safety-netted home. This is the audit-trail trap
      — a paper leaflet does not substitute for inpatient
      observation in this patient cohort.
    must_not_do: true
    sources:
      - {
          type: nice,
          id: 'NG232',
          ref: 'NICE NG232 — discharge criteria explicitly exclude anticoagulated patients with abnormal CT',
        }

  - id: mx_no_ct
    category: monitoring
    name: 'Skip CT — GCS 15 and "looks well"'
    detail: |
      ❌ The DOAC mandate over-rides GCS-based gating. The reason
      NG232 added the anticoagulant criterion is exactly this case
      — well-looking patients with occult SDH.
    must_not_do: true
    sources:
      - { type: nice, id: 'NG232', ref: 'NICE NG232 §1.5.13' }

  - id: mx_warfarin_reversal_in_doac
    category: drug
    name: 'Vitamin K + FFP as DOAC reversal'
    detail: |
      ❌ Vitamin K reverses WARFARIN (vitamin-K-dependent factors),
      not apixaban. FFP is ineffective for DOAC reversal — too
      little factor per unit volume to overcome the direct Xa
      inhibitor. **4-factor PCC 25–50 IU/kg** is the UK first-line
      for DOAC-associated ICH (BSH 2024); andexanet alfa is NOT
      NICE-recommended for ICH since TA1029 terminated Jan 2025
      (ANNEXa-I NEJM 2024).
    must_not_do: true
    sources:
      - {
          type: textbook,
          ref: 'British Society for Haematology — DOAC-associated bleeding guidance (2024): 4-factor PCC 25-50 IU/kg for ICH; NOT vitamin K, NOT FFP.',
        }

  - id: mx_no_aspirin_for_falls
    category: drug
    name: 'Add aspirin "to cover the AF" while apixaban is held'
    detail: |
      ❌ Adding aspirin during a held-DOAC period for head injury
      compounds bleed risk without meaningful stroke prevention.
      Anti-platelet bridging in stopped-DOAC AF is not supported
      by guidance and is a known examiner trap.
    must_not_do: true
    sources:
      - {
          type: textbook,
          ref: 'British Society for Haematology — peri-procedural / peri-bleed DOAC management 2024',
        }

  - id: mx_no_lying_only
    category: monitoring
    name: 'Skip the lying-standing BP'
    detail: |
      ❌ Cause-of-fall workup is a NICE NG232 admission criterion.
      A 78-year-old with two prior falls and unaddressed postural
      hypotension is in the same fall-pattern again without
      ramipril titration / OT review.
    must_not_do: true

# ─── Disposition ─────────────────────────────────────────────────────────
disposition_options:
  - label: 'Admit acute frailty / neuro obs ward; reversal + neurosurg liaison; falls MDT'
    criteria: |
      SDH on anticoagulation + age 78 + lives alone + recurrent
      falls. Inpatient is the only safe disposition. Reversal
      decision in parallel with neurosurg view.
    appropriate: true
  - label: 'Discharge with head injury leaflet and "see GP if worsens"'
    criteria: |
      Unsafe — anticoagulant + abnormal CT + recurrent faller +
      lives alone. Even a normal CT would mandate admission per
      NICE NG232 in this cohort.
    appropriate: false
  - label: 'Admit AMU on bed rest only (no reversal decision today)'
    criteria: |
      Partial — admission is correct, but the haematology /
      neurosurgical reversal decision should be initiated in ED
      while the bed is found, not deferred to the post-take ward
      round.
    appropriate: false

# ─── State machine ──────────────────────────────────────────────────────
state_machine:
  states: [stable, deteriorating, arrested, admitted]
  transitions:
    - from: stable
      to: deteriorating
      trigger:
        on: inaction_by
        min: 25
        required_actions: [mx_ct_head_within_8h, mx_apixaban_hold]
        note: 'Anticoagulant on board + untreated SDH → expanding haematoma; if no CT and no apixaban-hold by T+25 the bleed enlarges silently — case deteriorates.'
    - from: deteriorating
      to: stable
      trigger:
        on: action
        action_id: mx_haem_neurosurg_discuss
        note: 'Haematology + neurosurgery engaged — reversal decision underway; haematoma expansion controlled.'
    - from: stable
      to: admitted
      trigger:
        on: action
        action_id: mx_admission_observe
        note: 'Decision to admit triggers transfer; case closes from ED perspective.'

# ─── Pearls + pitfalls ──────────────────────────────────────────────────
pearls:
  - 'NICE NG232: ANY adult on anticoagulant + head injury = CT within 8 hours, regardless of GCS or symptoms.'
  - 'Canadian C-spine high-risk criteria: age ≥65, dangerous mechanism (fall ≥1 m / stairs / RTC), paraesthesia. Any positive = imaging.'
  - 'INR / PT / APTT do NOT measure apixaban / rivaroxaban effect — use anti-Xa activity calibrated for the specific DOAC.'
  - '**DOAC reversal for ICH (UK May 2026)**: 4-factor PCC 25-50 IU/kg per BSH 2024. Andexanet alfa is **NOT NICE-recommended for ICH** since TA1029 terminated Jan 2025 (ANNEXa-I NEJM 2024 — haemostasis improved but no mortality/disability benefit). Idarucizumab remains the specific reversal agent for dabigatran. TA697 remains active for GI bleeding.'
  - 'Vitamin K + FFP reverse WARFARIN, not DOACs. Easy examiner trap.'
  - 'Admission criteria after head injury include "on anticoagulant with abnormal CT" — admission is not a clinical-gestalt decision.'

pitfalls:
  - 'Skipping CT in the well-looking anticoagulated patient.'
  - 'Discharging home with a head injury leaflet.'
  - 'Using vitamin K + FFP for DOAC reversal.'
  - 'Bridging held-DOAC AF with aspirin (compounds bleed; no stroke prevention).'
  - 'Forgetting the cause-of-fall workup (postural BP, medication review, OT referral).'
  - 'Reading INR/APTT as "DOAC level".'

