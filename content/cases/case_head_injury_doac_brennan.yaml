author_notes: |
  Designed as the SAQ-classic "well-looking anticoagulated patient with
  head injury" — the headline NICE NG232 rule lives or dies on
  recognising that GCS 15 is not the gating criterion when a DOAC is
  on board.

  Pairs naturally with case_stroke_acute_williams (also DOAC-on-board)
  for a "DOAC reasoning" mini-series: ischaemic LVO on apixaban
  (alteplase contraindicated; thrombectomy preferred) vs
  haemorrhagic SDH on apixaban (reverse; admit; do not safety-net).

  Author against NICE NG232 (2023, §1.5.13 — "consider" CT in DOAC
  patients, softened from CG176 mandate), BSH DOAC bleeding 2024
  (4F-PCC 25-50 IU/kg for ICH), ANNEXa-I NEJM 2024 (TA697 ICH
  indication superseded by TA1029 termination Jan 2025), TA697 (now
  GI-bleed-only), BSH
  DOAC reversal 2024, Canadian C-spine Rule (Stiell 2001).
