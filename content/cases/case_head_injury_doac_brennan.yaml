# Head injury in an anticoagulated patient — NICE NG232 CT-head
# decision rules with the DOAC nuance. The instructive twist: the
# patient looks deceptively well on arrival (GCS 15, no focal signs),
# but anticoagulation alone mandates CT within 8 hours regardless.

schema_version: 1
id: case_head_injury_doac_brennan
title: 'Head injury — mechanical fall on apixaban'
chief_complaint: '?Bleed on anticoagulant'
topic_id: head_injury

vignette: |
  Majors, 14:48. Triage handover.

  Mrs Brennan, 78 y/o, brought in by son. Mechanical fall at home
  ~90 minutes ago — slipped on the rug, struck the right side of her
  forehead on the corner of the dresser. No LOC witnessed; her son
  found her sitting on the floor "a couple of minutes later" looking
  startled but talking.

  No vomiting. No seizure. She walked out to the car. On apixaban
  5 mg BD for paroxysmal AF.

  On arrival GCS 15, no focal neurology grossly. Small forehead
  haematoma. She is mildly anxious. BP 148/82, HR 88 sinus, sats 98%
  on air, temp afebrile.

  "She seems fine, doctor. Do we really need to wait around?"

curriculum_tags: [TP1, NeuC11]
slos: [1, 3, 4, 5]
difficulty_band: CT2
paeds: false

demographics:
  age_value: 78
  age_unit: years
  sex: female
  weight_kg: 64
  pmh:
    - 'Paroxysmal atrial fibrillation (CHA2DS2-VASc 4)'
    - 'Hypertension'
    - 'Type 2 diabetes — diet-controlled'
    - 'Bilateral cataract surgery 2024'
  medications:
    - 'Apixaban 5 mg BD'
    - 'Bisoprolol 2.5 mg OD'
    - 'Ramipril 5 mg OD'
    - 'Atorvastatin 40 mg OD'
  allergies: ['NKDA']
  social: 'Widowed; lives alone in a bungalow; son visits daily; independent in ADLs; uses a walking stick outdoors only.'

