# ─── History ──────────────────────────────────────────────────────────────
history:
  - id: hx_mechanism
    source: patient
    topic: 'What exactly happened — mechanism and timing?'
    response: |
      "I was carrying the kettle from the kitchen. I caught the corner
      of the rug. The dresser caught me right here above the eye. I
      remember sitting up. My son came in five minutes later. The
      kettle's still on the floor by the dresser."

  - id: hx_loc_amnesia
    source: family
    topic: 'Loss of consciousness, post-traumatic amnesia, witnessed events?'
    response: |
      "I didn't see it — I was in the garden. By the time I came in
      she was sitting up looking at the kettle. She knew where she
      was, said hello. She thought she'd been there about a minute.
      She doesn't remember actually hitting her head, just the
      tripping bit."

  - id: hx_anticoagulant
    source: gp_letter
    topic: 'Anticoagulant — agent, dose, time of last dose, renal function.'
    prereq_history_ids: [hx_mechanism]
    supports: ['Mild traumatic brain injury with traumatic subdural haematoma on anticoagulation']
    response: |
      "Apixaban 5 mg BD. Last dose 07:30 this morning per her dosette.
      Started 2023 for PAF. CHA2DS2-VASc 4 (age, sex, HTN, DM).
      Last U&E 6 weeks ago — eGFR 58, creatinine 92."

  - id: hx_other_drugs
    source: patient
    topic: 'Any antiplatelets, NSAIDs, alcohol, or herbal medicines?'
    prereq_history_ids: [hx_anticoagulant]
    response: |
      "I take paracetamol for my knees, maybe 2 tablets in the
      morning. No aspirin, no ibuprofen. I don't drink. The
      community pharmacist said no St John's Wort because of the
      apixaban."

  - id: hx_pmh_falls
    source: gp_letter
    topic: 'Previous falls or near-falls?'
    response: |
      "Two near-falls in the last 6 months — one over the rug,
      one in the bathroom. Mobility clinic referral 4 weeks ago,
      waiting for appointment. Falls bundle from the GP includes
      ramipril dose-titration and home OT review (not yet done)."

  - id: hx_post_fall
    source: patient
    topic: 'How have you felt since the fall?'
    supports: ['Mild traumatic brain injury with traumatic subdural haematoma on anticoagulation']
    response: |
      "Bit of a sore head. Some neck stiffness when I look up.
      My eyesight feels OK. I haven't been sick. No double
      vision. I felt a bit shaky right after, settled by the
      time my son arrived."

  - id: hx_son
    source: family
    topic: 'Speak to the son — concerns, what he saw, advance care plans.'
    prereq_history_ids: [hx_mechanism]
    npc_voice: "Her son arrives in damp coat, eyes immediately on the bandage. 'How bad?'"
    response: |
      "She's just keen to get home — my daughter's bringing
      the grandkids round at five. She's been getting more
      forgetful in the last year but no formal dementia
      diagnosis. No advance care plan documented. She'd want
      everything done."

